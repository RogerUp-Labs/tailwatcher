<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0a1a33"/>
      <stop offset="1" stop-color="#1f5fa8"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.75"/>
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <!-- radar rings sweeping out from the runway corner -->
    <g fill="none" stroke="#9cc8ff" stroke-width="10">
      <circle cx="96" cy="416" r="130" stroke-opacity="0.22"/>
      <circle cx="96" cy="416" r="230" stroke-opacity="0.15"/>
      <circle cx="96" cy="416" r="330" stroke-opacity="0.09"/>
    </g>
    <!-- runway -->
    <rect x="40" y="430" width="200" height="14" rx="7" fill="#ffffff" fill-opacity="0.18"/>
    <!-- climb trail -->
    <path d="M104 414 L210 308" stroke="url(#trail)" stroke-width="14" stroke-linecap="round" stroke-dasharray="2 26"/>
    <!-- aircraft, climbing out at 45° -->
    <path transform="translate(278 238) rotate(45) scale(1.18)" fill="#ffffff"
      d="M0,-100 C8,-100 12,-90 12,-78 L12,-24 L96,20 L96,40 L12,16 L12,56 L36,74 L36,90 L0,80 L-36,90 L-36,74 L-12,56 L-12,16 L-96,40 L-96,20 L-12,-24 L-12,-78 C-12,-90 -8,-100 0,-100 Z"/>
  </g>
  <!-- notification badge -->
  <circle cx="414" cy="98" r="54" fill="#ff8a3d" stroke="#0e2546" stroke-width="12"/>
  <path d="M414 70 v34" stroke="#fff" stroke-width="13" stroke-linecap="round"/>
  <circle cx="414" cy="126" r="7.5" fill="#fff"/>
</svg>
