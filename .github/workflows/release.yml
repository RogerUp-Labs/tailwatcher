# Builds the TailWatcher .s9pk for x86_64 and aarch64.
#
# - Pull requests: test + build both packages (kept as workflow artifacts).
# - Pushing a tag like v0.18.0: the same, then a GitHub release with both
#   packages attached. Merging to main never publishes anything: versions
#   keep bumping per feature for local testing, and only a tag releases. The
#   release notes cover every version since the previous tag.
#
# Signing: set the repository secret DEV_KEY to the contents of
# ~/.startos/developer.key.pem so released packages carry the same signature
# as local `make` builds. Tag builds refuse to run without it; PR builds fall
# back to a throwaway key.

name: Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Same start-cli as the local build machine. Newer releases changed how
  # `s9pk pack` finds its signing key, so bump this deliberately.
  START_CLI_VERSION: v0.4.0-beta.9

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(grep -oP "version:\s*'\K[^':]+" startos/versions/current.ts)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match startos/versions/current.ts ($VERSION)"
            exit 1
          fi

      - name: Unit tests
        run: make test

      - name: Type check
        run: |
          npm ci
          npm run check

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86
            arch: x86_64
            runner: ubuntu-latest
          - target: arm
            arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install start-cli
        run: |
          curl -fsSL -o /tmp/start-cli \
            "https://github.com/Start9Labs/start-technologies/releases/download/${START_CLI_VERSION}/start-cli_${{ matrix.arch }}-linux"
          sudo install -m 755 /tmp/start-cli /usr/local/bin/start-cli
          sudo apt-get install -y -qq squashfs-tools-ng > /dev/null
          start-cli --version

      - name: Set up signing key
        env:
          DEV_KEY: ${{ secrets.DEV_KEY }}
        run: |
          mkdir -p ~/.startos
          if [ -n "$DEV_KEY" ]; then
            printf '%s\n' "$DEV_KEY" > ~/.startos/developer.key.pem
            chmod 600 ~/.startos/developer.key.pem
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "::error::Add the DEV_KEY repository secret (contents of ~/.startos/developer.key.pem) before releasing."
            exit 1
          else
            echo "::warning::No DEV_KEY secret; signing this test build with a throwaway key."
            start-cli init-key
          fi

      - name: Build (make ${{ matrix.target }})
        run: |
          npm ci
          make ${{ matrix.target }}
          sha256sum *.s9pk

      - uses: actions/upload-artifact@v4
        with:
          name: s9pk-${{ matrix.arch }}
          path: '*.s9pk'
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: s9pk-*
          merge-multiple: true

      # Covers every version since the previous release tag, since versions
      # in between were only tested locally and never published.
      - name: Write release body
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            if [ -n "$PREVIOUS" ]; then
              echo "Changes since $PREVIOUS:"
              echo
            fi
            python3 .github/release_notes.py "$PREVIOUS"
            echo
            echo "## Install"
            echo
            echo "Download the x86_64 file for most servers (aarch64 for ARM ones) and sideload it in StartOS."
            echo
            echo "## SHA256"
            echo '```'
            sha256sum *.s9pk
            echo '```'
          } > body.md

      - uses: softprops/action-gh-release@v2
        with:
          name: TailWatcher ${{ github.ref_name }}
          body_path: body.md
          files: '*.s9pk'
