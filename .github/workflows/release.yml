# Builds the TailWatcher .s9pk for x86_64 and aarch64, and the plain Docker
# image (docker/docker-compose.yml) for running without a Start9.
#
# - Pull requests: test + build both packages (kept as workflow artifacts),
#   and build the Docker image and check it starts and answers /health.
# - Pushing a tag like v0.18.0: the same, then a GitHub release with both
#   packages attached, and the Docker image (amd64 + arm64) pushed to
#   ghcr.io/rogerup-labs/tailwatcher as :X.Y.Z and :latest. Merging to main
#   never publishes anything: versions keep bumping per feature for local
#   testing, and only a tag releases. The release notes cover every version
#   since the previous tag.
#
# Signing: set the repository secret DEV_KEY to the contents of
# ~/.startos/developer.key.pem so released packages carry the same signature
# as local `make` builds. Tag builds refuse to run without it; PR builds fall
# back to a throwaway key.

name: Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Same start-cli as the local build machine. Newer releases changed how
  # `s9pk pack` finds its signing key, so bump this deliberately.
  START_CLI_VERSION: v0.4.0-beta.9

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(grep -oP "version:\s*'\K[^':]+" startos/versions/current.ts)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match startos/versions/current.ts ($VERSION)"
            exit 1
          fi

      - name: Unit tests
        run: make test

      - name: Type check
        run: |
          npm ci
          npm run check

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86
            arch: x86_64
            runner: ubuntu-latest
          - target: arm
            arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install start-cli
        run: |
          curl -fsSL -o /tmp/start-cli \
            "https://github.com/Start9Labs/start-technologies/releases/download/${START_CLI_VERSION}/start-cli_${{ matrix.arch }}-linux"
          sudo install -m 755 /tmp/start-cli /usr/local/bin/start-cli
          sudo apt-get install -y -qq squashfs-tools-ng > /dev/null
          start-cli --version

      - name: Set up signing key
        env:
          DEV_KEY: ${{ secrets.DEV_KEY }}
        run: |
          mkdir -p ~/.startos
          if [ -n "$DEV_KEY" ]; then
            printf '%s\n' "$DEV_KEY" > ~/.startos/developer.key.pem
            chmod 600 ~/.startos/developer.key.pem
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "::error::Add the DEV_KEY repository secret (contents of ~/.startos/developer.key.pem) before releasing."
            exit 1
          else
            echo "::warning::No DEV_KEY secret; signing this test build with a throwaway key."
            start-cli init-key
          fi

      - name: Build (make ${{ matrix.target }})
        run: |
          npm ci
          make ${{ matrix.target }}
          sha256sum *.s9pk

      - uses: actions/upload-artifact@v7
        with:
          name: s9pk-${{ matrix.arch }}
          path: '*.s9pk'
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/rogerup-labs/tailwatcher
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: tailwatcher:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A fresh container with an empty /data, as a NAS user would start it:
      # it must make a dashboard password, keep /health open, and lock the rest.
      - name: Smoke test
        run: |
          docker run -d --name tw -p 8080:8080 tailwatcher:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/health && break
            sleep 1
          done
          echo
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" = 303  # to the sign-in page
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/state)" = 401
          PW=$(docker exec tw python /app/tailwatcher.py password)
          curl -fsS -u "x:$PW" http://localhost:8080/api/state | python3 -c \
            "import json,sys; d=json.load(sys.stdin); assert d['settings']['platform'] == 'docker', d['settings']; assert d['me']['setup'], d['me']; print('version', d['version'])"
          docker logs tw 2>&1 | grep -q "Web UI password"
          docker rm -f tw

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4
        if: startsWith(github.ref, 'refs/tags/')

      - name: Image version (v0.19.0 → 0.19.0)
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Push ${{ env.IMAGE }}
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: s9pk-*
          merge-multiple: true

      # Covers every version since the previous release tag, since versions
      # in between were only tested locally and never published.
      - name: Write release body
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            if [ -n "$PREVIOUS" ]; then
              echo "Changes since $PREVIOUS:"
              echo
            fi
            python3 .github/release_notes.py "$PREVIOUS"
            echo
            echo "## Install"
            echo
            echo "Download the x86_64 file for most servers (aarch64 for ARM ones) and sideload it in StartOS."
            echo
            echo "Without a Start9 (Synology, Unraid, TrueNAS or any Docker host): use [docker-compose.yml](https://github.com/RogerUp-Labs/tailwatcher/blob/${GITHUB_REF_NAME}/docker/docker-compose.yml) with the image \`ghcr.io/rogerup-labs/tailwatcher:${GITHUB_REF_NAME#v}\` (or \`:latest\`)."
            echo
            echo "## SHA256"
            echo '```'
            sha256sum *.s9pk
            echo '```'
          } > body.md

      - uses: softprops/action-gh-release@v3
        with:
          name: TailWatcher ${{ github.ref_name }}
          body_path: body.md
          files: '*.s9pk'
