<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0e2546">
<title>TailWatcher</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root {
  --bg: #f3f5f9;
  --surface: #ffffff;
  --surface-2: #f7f9fc;
  --border: #e3e8f0;
  --text: #0f1b2d;
  --text-2: #4a5a70;
  --text-3: #7a889c;
  --brand: #1f5fa8;
  --brand-ink: #0e2546;
  --brand-soft: #e6eefa;
  --accent: #e8711f;
  --accent-soft: #fdeee2;
  --ok: #1e8a4c;
  --ok-soft: #e3f4ea;
  --warn: #b25e00;
  --warn-soft: #fff1dc;
  --bad: #c2312b;
  --bad-soft: #fde7e6;
  --air: #1f5fa8;
  --air-soft: #e6eefa;
  --shadow: 0 1px 2px rgba(15, 27, 45, .06), 0 2px 8px rgba(15, 27, 45, .04);
  --radius: 14px;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0a111e;
    --surface: #111b2c;
    --surface-2: #0e1727;
    --border: #1f2c42;
    --text: #e6edf7;
    --text-2: #a9b6c9;
    --text-3: #7486a0;
    --brand: #6aa6ff;
    --brand-ink: #e6edf7;
    --brand-soft: #16284a;
    --accent: #ff9a52;
    --accent-soft: #3a2414;
    --ok: #4cc983;
    --ok-soft: #12301f;
    --warn: #ffb547;
    --warn-soft: #3a2a10;
    --bad: #ff6b63;
    --bad-soft: #3a1513;
    --air: #6aa6ff;
    --air-soft: #16284a;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-variant-numeric: tabular-nums;
}
a { color: var(--brand); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }

/* ---------- top bar ---------- */
.top {
  position: sticky; top: 0; z-index: 5;
  background: linear-gradient(135deg, #0a1a33, #1f5fa8); color: #fff;
  padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
}
.top-inner { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.top img { width: 34px; height: 34px; border-radius: 9px; flex: none; }
.brand { font-weight: 700; font-size: 18px; letter-spacing: .2px; }
.brand small { display: block; font-weight: 400; font-size: 12px; opacity: .75; }
.status {
  margin-left: auto; display: flex; align-items: center; gap: 8px; min-width: 0;
  background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18);
  padding: 6px 10px; border-radius: 999px; font-size: 13px;
}
.status span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 42vw; }
/* The halo is a border, not a box-shadow, so it can't drift off-centre from the
   dot at fractional pixel positions (Safari draws small box-shadows offset). */
.dot { width: 14px; height: 14px; border-radius: 50%; flex: none; background: #4cc983 padding-box; border: 3px solid rgba(76,201,131,.25); margin: -3px; }
.dot.bad { background-color: #ff6b63; border-color: rgba(255,107,99,.25); }
.dot.wait { background-color: #ffb547; border-color: rgba(255,181,71,.25); }

/* ---------- layout ---------- */
main { max-width: 1180px; margin: 0 auto; padding: 16px 16px calc(env(safe-area-inset-bottom) + 32px); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); }
.stat b { display: block; font-size: 24px; line-height: 1.2; }
.stat span { color: var(--text-3); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
.stat.hot b { color: var(--air); }
.stat .short { display: none; }
.grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.col { display: grid; gap: 16px; min-width: 0; }
section h2 {
  font-size: 13px; text-transform: uppercase; letter-spacing: .7px; color: var(--text-3);
  margin: 4px 2px 8px; display: flex; align-items: center; gap: 8px;
}
section h2 .count { background: var(--surface); border: 1px solid var(--border); color: var(--text-2); border-radius: 999px; padding: 0 8px; font-size: 11px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.empty { padding: 18px; color: var(--text-3); text-align: center; font-size: 14px; }
.empty code { background: var(--surface-2); border: 1px solid var(--border); padding: 1px 6px; border-radius: 6px; font-family: var(--mono); font-size: 13px; color: var(--text-2); }

/* ---------- watchers ---------- */
.watcher + .watcher { margin-top: 12px; }
.w-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); background: var(--surface-2); }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; background: var(--brand); flex: none; }
.w-name { font-weight: 650; }
.w-topic { color: var(--text-3); font-size: 12px; font-family: var(--mono); }
.w-tags { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); color: var(--text-2); white-space: nowrap; }
.tag.brand { background: var(--brand-soft); border-color: transparent; color: var(--brand); }
.tag.accent { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.ac { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 11px 14px; align-items: center; }
.ac + .ac { border-top: 1px solid var(--border); }
.ac-id { font-family: var(--mono); font-weight: 700; font-size: 15px; letter-spacing: .3px; }
.ac-id .nick { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 400; color: var(--text-2); letter-spacing: 0; margin-left: 6px; font-size: 14px; }
.ac-meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 10px; color: var(--text-3); font-size: 13px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.chip.air { background: var(--air-soft); color: var(--air); }
.chip.ground { background: var(--ok-soft); color: var(--ok); }
.chip.unknown { background: var(--surface-2); color: var(--text-3); border: 1px solid var(--border); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.pulse { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 currentColor; } 70% { box-shadow: 0 0 0 6px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }

/* ---------- trips ---------- */
.trip { padding: 14px; }
.trip + .trip, .journey + .trip, .trip + .journey, .journey + .journey { border-top: 1px solid var(--border); }
.j-head { padding: 12px 14px 0; font-size: 12px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; color: var(--accent); }
.journey .trip + .trip { border-top: 1px dashed var(--border); }
.form-sub { margin: 6px 0 -2px; padding-top: 10px; border-top: 1px solid var(--border); font-weight: 600; }
.form-sub small { display: block; font-weight: 400; color: var(--text-3); white-space: pre-line; }
.t-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.t-flight { font-family: var(--mono); font-weight: 800; font-size: 20px; letter-spacing: .3px; }
.t-when { color: var(--text-2); }
.t-who { margin-left: auto; color: var(--text-3); font-size: 13px; }
.route { display: flex; align-items: center; gap: 10px; margin: 10px 0 12px; }
.apt { font-family: var(--mono); font-weight: 700; font-size: 17px; }
.apt small { display: block; font-family: system-ui, sans-serif; font-weight: 400; font-size: 12px; color: var(--text-3); }
.route .line { flex: 1; height: 2px; background: repeating-linear-gradient(90deg, var(--border) 0 6px, transparent 6px 11px); position: relative; }
.route .line::after { content: "✈"; position: absolute; top: -11px; left: 50%; transform: translateX(-50%); color: var(--brand); font-size: 15px; background: var(--surface); padding: 0 4px; }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 4px 0 10px; }
.step { font-size: 11px; color: var(--text-3); text-align: center; }
.step i { display: block; height: 4px; border-radius: 4px; background: var(--border); margin-bottom: 6px; }
.step.done i { background: var(--brand); }
.step.done { color: var(--text-2); }
.step.now i { background: linear-gradient(90deg, var(--brand), var(--accent)); }
.step.now { color: var(--text); font-weight: 600; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--text-3); }
.kv dd { margin: 0; color: var(--text); min-width: 0; overflow-wrap: anywhere; }
.banner { margin: 10px 0 0; padding: 9px 11px; border-radius: 10px; font-size: 13px; }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.banner.bad { background: var(--bad-soft); color: var(--bad); }
.banner code { font-family: var(--mono); font-weight: 600; }

/* ---------- activity ---------- */
.feed { max-height: 760px; overflow: auto; }
.day { position: sticky; top: 0; background: var(--surface-2); border-bottom: 1px solid var(--border); color: var(--text-3); font-size: 11px; text-transform: uppercase; letter-spacing: .6px; padding: 6px 14px; }
.ev { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; padding: 10px 14px; }
.ev + .ev { border-top: 1px solid var(--border); }
.ev-icon { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-size: 14px; background: var(--surface-2); border: 1px solid var(--border); }
.ev.in .ev-icon { background: var(--brand-soft); border-color: transparent; }
.ev-head { display: flex; gap: 8px; align-items: baseline; font-size: 12px; color: var(--text-3); }
.ev-head .who { color: var(--text-2); font-weight: 600; }
.ev-head time { margin-left: auto; white-space: nowrap; }
.ev-title { font-weight: 600; font-size: 14px; margin-top: 1px; }
.ev-msg { color: var(--text-2); font-size: 13px; white-space: pre-line; overflow-wrap: anywhere;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
.ev-msg.open { -webkit-line-clamp: unset; }
.ev.in .ev-msg { font-family: var(--mono); color: var(--text); }
.ev .chip { margin-top: 4px; }

/* ---------- system ---------- */
.sys { padding: 4px 0; }
.row { display: flex; align-items: center; gap: 10px; padding: 9px 14px; font-size: 14px; }
.row + .row { border-top: 1px solid var(--border); }
.row .label { color: var(--text-2); }
.row .val { margin-left: auto; text-align: right; color: var(--text); font-size: 13px; }
.ok { color: var(--ok); } .bad { color: var(--bad); } .muted { color: var(--text-3); }
footer { color: var(--text-3); font-size: 12px; text-align: center; margin-top: 24px; }

/* ---------- small screens ---------- */
@media (max-width: 900px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  .feed { max-height: none; }
}
@media (max-width: 560px) {
  .stats { gap: 8px; }
  .stat { padding: 9px 8px; text-align: center; }
  .stat b { font-size: 20px; }
  .stat .long { display: none; }
  .stat .short { display: block; font-size: 10.5px; letter-spacing: .3px; }
  .brand small { display: none; }
  .status span { max-width: 46vw; }
  .t-who { margin-left: 0; width: 100%; }
}

/* ---------- editing ---------- */
.btn { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
.btn:hover { border-color: var(--text-3); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
.theme-board .btn.primary { color: #0c0d10; }
.btn.danger { color: var(--bad); border-color: transparent; background: transparent; margin-right: auto; padding-left: 0; }
.linkbtn { font: inherit; font-size: inherit; background: none; border: 0; padding: 0; color: var(--brand); cursor: pointer; }
.linkbtn:hover { text-decoration: underline; }
section h2 .add + .add { margin-left: 14px; }
section h2 .add { margin-left: auto; font-size: 12px; letter-spacing: 0; text-transform: none; font-weight: 600; }
.w-head .linkbtn, .flap-group .linkbtn { font-size: 13px; font-weight: 400; letter-spacing: 0; text-transform: none; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.ac-edit { margin-left: 6px; }
.t-actions { display: flex; gap: 16px; margin-top: 10px; font-size: 13px; }
dialog { border: 1px solid var(--border); border-radius: 14px; padding: 0; width: min(440px, calc(100vw - 32px)); background: var(--surface); color: var(--text); box-shadow: 0 10px 40px rgba(0,0,0,.35); }
dialog::backdrop { background: rgba(5, 10, 20, .55); }
dialog form { padding: 18px; display: grid; gap: 12px; }
dialog h3 { margin: 0 0 2px; font-size: 17px; }
.theme-board dialog h3 { font-family: var(--board-font); letter-spacing: 1.5px; text-transform: uppercase; color: #ffd23f; }
.field { display: grid; gap: 4px; font-size: 13px; color: var(--text-2); }
.field input, .field select, .field textarea { font: inherit; font-size: 15px; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); width: 100%; }
.field textarea { min-height: 150px; resize: vertical; font-size: 13px; }
.field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--brand); outline-offset: 0; }
.field small { color: var(--text-3); font-size: 12px; }
.field.check { grid-template-columns: auto 1fr; align-items: center; gap: 8px; color: var(--text); font-size: 14px; }
.field.check input { width: 18px; height: 18px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.checks { display: grid; gap: 6px; font-size: 13px; color: var(--text-2); }
.checks .opts { display: flex; flex-wrap: wrap; gap: 8px; }
.checks label { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 999px; color: var(--text); font-size: 14px; cursor: pointer; }
.checks input { width: 16px; height: 16px; margin: 0; }
.checks small { color: var(--text-3); font-size: 12px; }
.following { padding: 8px 14px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--text-2); display: grid; gap: 2px; }
.following b { color: var(--text); font-family: var(--mono); }
.form-error { color: var(--bad); font-size: 13px; white-space: pre-line; }
.connect ol { margin: 0; padding-left: 20px; display: grid; gap: 12px; font-size: 14px; color: var(--text); }
.connect .stores { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.connect .stores a { font-size: 13px; padding: 5px 10px; border: 1px solid var(--border); border-radius: 999px; }
.connect .bigLink, .invite-box .bigLink { display: block; margin-top: 6px; padding: 10px 12px; border-radius: 10px; background: var(--brand-soft); color: var(--brand); font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; font-weight: 600; }
.connect .row-btns, .invite-box .row-btns { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.connect .note, .invite-box .note { font-size: 12.5px; color: var(--text-3); margin-top: 4px; }
.invite-box { display: grid; gap: 8px; min-width: 0; padding: 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); margin-bottom: 14px; }
.invite-box h4 { margin: 0; font-size: 15px; }
.invite-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.invite-row input, .invite-row select { font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
.invite-row input { flex: 1; min-width: 140px; }
.invite-list { font-size: 13px; color: var(--text-2); display: grid; gap: 4px; }
.warn-text { color: var(--warn); font-size: 13px; }
.gear { border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.12); color: #fff; border-radius: 999px; padding: 5px 11px; font: inherit; font-size: 12px; cursor: pointer; flex: none; }
.theme-board .gear { background: #15171b; border-color: #24272d; }
dialog.wide { width: min(560px, calc(100vw - 32px)); }
.set-section { border-top: 1px solid var(--border); padding-top: 12px; display: grid; gap: 10px; }
.set-section:first-of-type { border-top: 0; padding-top: 0; }
.set-section h4 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .7px; color: var(--text-3); }
.radio-card { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; cursor: pointer; font-size: 14px; }
.radio-card input { grid-row: span 2; margin-top: 3px; width: 16px; height: 16px; }
.radio-card small { color: var(--text-3); font-size: 12.5px; }
.radio-card:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); }
.sub-panel { display: grid; gap: 10px; padding: 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); }
.sub-panel[hidden] { display: none; }
.steps-done { margin: 0; padding-left: 18px; font-size: 13px; color: var(--ok); display: grid; gap: 3px; }
.creds { font-family: var(--mono); font-size: 13px; background: var(--brand-soft); padding: 8px 10px; border-radius: 8px; overflow-wrap: anywhere; }
.status-line { font-size: 13px; color: var(--text-2); }
dialog.help { width: min(720px, calc(100vw - 24px)); }
.help-top { position: sticky; top: 0; background: var(--surface); padding-bottom: 8px; z-index: 1; display: grid; gap: 8px; }
.help-top input { font: inherit; font-size: 15px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); width: 100%; }
.help-toc { display: flex; flex-wrap: wrap; gap: 6px; }
.help-toc a { font-size: 12.5px; padding: 3px 9px; border: 1px solid var(--border); border-radius: 999px; }
.guide { font-size: 14.5px; line-height: 1.55; color: var(--text); max-height: min(68vh, 900px); overflow: auto; padding-right: 4px; }
.guide h2 { font-size: 18px; margin: 22px 0 8px; text-transform: none; letter-spacing: 0; color: var(--text); display: block; font-family: inherit; font-weight: 700; }
.guide section:first-child h2 { margin-top: 4px; }
.guide h3 { font-size: 15.5px; margin: 16px 0 6px; }
.guide p { margin: 8px 0; }
.guide ul, .guide ol { margin: 6px 0; padding-left: 22px; }
.guide li { margin: 3px 0; }
.guide code { font-family: var(--mono); font-size: 13px; background: var(--surface-2); border: 1px solid var(--border); padding: 0 5px; border-radius: 5px; }
.guide table { border-collapse: collapse; width: 100%; font-size: 13.5px; margin: 8px 0; }
.guide td, .guide th { border-bottom: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top; }
.guide blockquote { margin: 8px 0; padding: 8px 12px; border-left: 3px solid var(--brand); background: var(--surface-2); color: var(--text-2); }
.guide mark { background: #ffe58a; color: #1a1300; border-radius: 3px; padding: 0 1px; }
.guide .hidden { display: none; }
.guide .copy-for { float: right; margin-top: -2px; }
.help-link { font-size: 12.5px; }
.form-error:empty { display: none; }
.dlg-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; align-items: center; margin-top: 4px; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 20px); transform: translateX(-50%) translateY(20px); opacity: 0; transition: .25s; background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: calc(100vw - 32px); white-space: pre-line; z-index: 20; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.theme-board .toast { background: #ffd23f; color: #0c0d10; }

/* ---------- theme switch ---------- */
.themes { display: flex; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 2px; flex: none; }
.themes button { border: 0; background: transparent; color: rgba(255,255,255,.8); font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 999px; cursor: pointer; }
.themes button[aria-pressed="true"] { background: #fff; color: #0e2546; font-weight: 600; }
@media (max-width: 560px) {
  .status { padding: 8px; margin-left: auto; } .status span { display: none; }
  .top-inner { gap: 10px; flex-wrap: wrap; row-gap: 8px; } .top img { width: 30px; height: 30px; }
  /* The theme switch gets its own row so the header fits phone widths. */
  .themes { order: 1; margin-left: auto; }
  .themes button { padding: 4px 8px; }
  .gear { padding: 5px 9px; font-size: 15px; } .gear-label { display: none; }
  .theme-board .brand { font-size: 16px; letter-spacing: 1px; }
}

/* ---------- board theme: an airport departures board ---------- */
.theme-board {
  color-scheme: dark;
  --bg: #0c0d10; --surface: #15171b; --surface-2: #101215; --border: #24272d;
  --text: #f2eee2; --text-2: #b9bcc4; --text-3: #7d8290;
  --brand: #ffd23f; --brand-soft: #2a2610; --ok: #6fe39b; --ok-soft: #12261a;
  --warn: #ffb347; --warn-soft: #2d2112; --bad: #ff7a5c; --bad-soft: #2d1612;
  --air: #ffd23f; --air-soft: #2a2610; --accent: #ffb347; --accent-soft: #2d2112;
  --shadow: none; --radius: 6px;
  --tile-w: 15px; --tile-h: 23px; --tile-font: 14px;
  --board-font: "DIN Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
}
.theme-board .top { background: #08090b; border-bottom: 2px solid #ffd23f; }
.theme-board .brand { font-family: var(--board-font); text-transform: uppercase; letter-spacing: 2px; font-size: 20px; }
.theme-board .brand small { letter-spacing: .5px; text-transform: none; font-family: system-ui, sans-serif; }
.theme-board .status, .theme-board .themes { background: #15171b; border-color: #24272d; }
.theme-board .themes button[aria-pressed="true"] { background: #ffd23f; color: #0c0d10; }
.theme-board section h2 { font-family: var(--board-font); font-size: 16px; letter-spacing: 3px; color: #ffd23f; font-weight: 600; }
.theme-board section h2 .count { background: #ffd23f; color: #0c0d10; border: 0; font-family: var(--mono); }
.theme-board .stat { text-align: center; }
.theme-board .stat b { font-family: var(--mono); color: #f2eee2; background: #24272d; display: inline-block; min-width: 1.6em; padding: 0 6px; border-radius: 3px; position: relative; }
.theme-board .stat b::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: #0c0d10; }
.theme-board .stat.hot b { color: #ffd23f; }
.theme-board .stat span { font-family: var(--board-font); letter-spacing: 1.5px; font-size: 13px; margin-top: 4px; display: block; }
.theme-board .stat span.short { display: none; }
@media (max-width: 560px) { .theme-board .stat span.long { display: none; } .theme-board .stat span.short { display: block; font-size: 11px; letter-spacing: .8px; } }
.theme-board .card { border-radius: 8px; }
.theme-board .empty code, .theme-board .banner code { color: #ffd23f; }

.flap-board { padding: 12px 12px 6px; }
.flap-head, .flap-row { display: grid; gap: 8px; align-items: center; }
.flap-head { font-family: var(--board-font); font-size: 12px; letter-spacing: 1.5px; color: var(--text-3); text-transform: uppercase; margin-bottom: 8px; }
.flap-row { margin-bottom: 4px; }
.cols-trip { grid-template-columns: auto auto auto auto; }
.cols-fleet { grid-template-columns: auto auto auto; }
.flaps { display: flex; gap: 2px; }
.flap {
  position: relative; width: var(--tile-w); height: var(--tile-h); border-radius: 2px;
  background: linear-gradient(#26292f 0 50%, #202328 50% 100%); color: #f2eee2;
  font: 600 var(--tile-font)/1 var(--mono); display: flex; align-items: center; justify-content: center;
}
.flap::after { content: ""; position: absolute; left: 0; right: 0; top: calc(50% - .5px); height: 1px; background: #08090b; }
.flap.y { color: #ffd23f; } .flap.g { color: #6fe39b; } .flap.o { color: #ffb347; } .flap.r { color: #ff7a5c; } .flap.m { color: #7d8290; }
.flap.flip { animation: flapflip .42s cubic-bezier(.3,.6,.4,1) both; transform-origin: 50% 50%; }
@keyframes flapflip { 0% { transform: rotateX(0); } 45% { transform: rotateX(88deg); filter: brightness(.6); } 55% { transform: rotateX(-88deg); filter: brightness(.6); } 100% { transform: rotateX(0); } }
@media (prefers-reduced-motion: reduce) { .flap.flip { animation: none; } }
.flap-sub { font-size: 12.5px; color: var(--text-2); margin: 2px 0 12px 2px; overflow-wrap: anywhere; }
.flap-sub b { color: var(--text); font-weight: 600; }
.flap-sub .y { color: #ffd23f; } .flap-sub .o { color: #ffb347; } .flap-sub .r { color: #ff7a5c; }
.flap-sub code { font-family: var(--mono); color: #ffd23f; }
.flap-group { font-family: var(--board-font); letter-spacing: 1.5px; text-transform: uppercase; font-size: 13px; color: var(--text-2); margin: 10px 2px 8px; display: flex; gap: 8px; align-items: baseline; }
.flap-group:first-child { margin-top: 0; }
.flap-group { flex-wrap: wrap; row-gap: 4px; }
.flap-group small { font-family: var(--mono); letter-spacing: 0; text-transform: none; color: var(--text-3); font-size: 11px; overflow-wrap: anywhere; min-width: 0; }
.flap-group .linkbtn { white-space: nowrap; }
.flap-group .tag { font-family: system-ui, sans-serif; letter-spacing: 0; }
.only-wide { display: flex; }
.only-narrow { display: none; }
.theme-board .ev-icon { background: #24272d; border: 0; }
.theme-board .ev-title { font-family: var(--board-font); letter-spacing: .6px; font-size: 15px; font-weight: 600; }
.theme-board .ev-head time { color: #ffd23f; font-family: var(--mono); }
.theme-board .ev.in .ev-msg { color: #ffd23f; }
.theme-board .day { font-family: var(--board-font); letter-spacing: 2px; color: #ffd23f; }
.theme-board .row .label { font-family: var(--board-font); letter-spacing: 1px; text-transform: uppercase; font-size: 13px; }
@media (max-width: 560px) {
  .theme-board { --tile-w: 13px; --tile-h: 21px; --tile-font: 12.5px; }
  .cols-trip { grid-template-columns: auto auto auto; }
  .only-wide { display: none; }
  .only-narrow { display: inline; }
}
/* Small phones (360 px): a trip row is 21 tiles, so shrink them to fit. */
@media (max-width: 380px) {
  .theme-board { --tile-w: 12px; --tile-h: 20px; --tile-font: 11.5px; }
  .flap-head, .flap-row { gap: 6px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <img src="icon.svg" alt="">
    <div class="brand">TailWatcher<small id="sub">Takeoff alerts for the planes you follow</small></div>
    <div class="status" role="status" aria-live="polite"><i class="dot wait" id="dot"></i><span id="statusText">Loading…</span></div>
    <button type="button" class="gear" data-act="help" aria-label="Help">?<span class="gear-label"> Help</span></button>
    <button type="button" class="gear" data-act="settings" aria-label="Settings">⚙<span class="gear-label"> Settings</span></button>
    <div class="themes" role="group" aria-label="Theme">
      <button type="button" data-theme="modern">Modern</button>
      <button type="button" data-theme="board">Board</button>
    </div>
  </div>
</header>

<main>
  <div class="stats" id="stats"></div>
  <div class="grid">
    <div class="col">
      <section aria-labelledby="h-trips"><h2 id="h-trips">Trips <span class="count" id="c-trips">0</span><button type="button" class="linkbtn add" data-act="add-trip">+ Add trip</button><button type="button" class="linkbtn add" data-act="import-trip">Import</button></h2><div class="card" id="trips"></div></section>
      <section aria-labelledby="h-watch"><h2 id="h-watch">Watchers <span class="count" id="c-watch">0</span><button type="button" class="linkbtn add" data-act="add-watcher">+ Add watcher</button></h2><div id="watchers"></div></section>
    </div>
    <div class="col">
      <section aria-labelledby="h-act"><h2 id="h-act">Activity</h2><div class="card feed" id="feed"></div></section>
      <section aria-labelledby="h-sys"><h2 id="h-sys">System</h2><div class="card sys" id="system"></div></section>
    </div>
  </div>
  <footer id="foot"></footer>
</main>
<dialog id="dlg" aria-labelledby="dlg-title"><form id="dlg-form" novalidate></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
let TZ, NOW = Date.now() / 1000, lastLoad = 0;

function fmtTime(t) { return new Intl.DateTimeFormat(undefined, {hour: "numeric", minute: "2-digit", timeZone: TZ}).format(t * 1000); }
function fmtDay(t) { return new Intl.DateTimeFormat(undefined, {weekday: "short", month: "short", day: "numeric", timeZone: TZ}).format(t * 1000); }
function fmtDate(iso) { const [y, m, d] = iso.split("-").map(Number); return new Intl.DateTimeFormat(undefined, {weekday: "short", month: "short", day: "numeric", timeZone: "UTC"}).format(Date.UTC(y, m - 1, d)); }
function dayKey(t) { return new Intl.DateTimeFormat("en-CA", {timeZone: TZ}).format(t * 1000); }
function ago(t) {
  const s = Math.max(0, NOW - t);
  if (s < 60) return "just now";
  if (s < 3600) return Math.round(s / 60) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + " h ago";
  return Math.round(s / 86400) + " d ago";
}
function until(t) {
  const s = t - NOW;
  if (s <= 60) return "now";
  if (s < 3600) return "in " + Math.round(s / 60) + " min";
  if (s < 86400) return "in " + Math.round(s / 3600) + " h";
  return "in " + Math.round(s / 86400) + " d";
}
const num = (n) => Number(n).toLocaleString();
const initials = (name) => (name || "?").trim().split(/\s+/).map((w) => w[0]).join("").slice(0, 2).toUpperCase();
const HUES = ["#1f5fa8", "#7a4cc2", "#1e8a6a", "#c2562b", "#a8326e", "#3a6f2a"];
const hue = (i) => HUES[i % HUES.length];  // by watcher order, so neighbours never match
// Only while the plane is transmitting: a parked plane's map shows nothing live.
const mapLink = (a) => a.hex && a.live ? `https://globe.adsbexchange.com/?icao=${encodeURIComponent(a.hex)}` : null;

// "near Denver, CO" from the last fix; a quiet plane's is where it was last heard.
const whereText = (a) => a.where ? (a.live ? a.where : "last seen " + a.where) : "";

function statusChip(a) {
  if (a.status === "airborne") {
    const bits = [typeof a.alt === "number" ? num(a.alt) + " ft" : "", a.gs ? Math.round(a.gs) + " kt" : ""].filter(Boolean).join(" · ");
    return `<span class="chip air"><i class="pulse"></i>Airborne${bits ? " · " + bits : ""}</span>`;
  }
  if (a.status === "ground" && a.live) return `<span class="chip ground">On the ground</span>`;
  if (a.status === "ground") return `<span class="chip unknown">Parked${a.last_seen ? " · seen " + ago(a.last_seen) : ""}</span>`;
  return `<span class="chip unknown">Not seen${a.last_seen ? " · " + ago(a.last_seen) : ""}</span>`;
}

function renderStats(d) {
  const all = d.watchers.flatMap((w) => w.aircraft);
  const unique = new Set(all.map((a) => a.ident));
  const airborne = new Set(all.filter((a) => a.status === "airborne").map((a) => a.ident));
  const upcoming = d.trips.filter((t) => !t.landed).length;
  const alerts = d.history.filter((e) => e.dir === "out" && (e.kind === "alert" || e.kind === "trip") && NOW - e.t < 86400).length;
  $("stats").innerHTML = [
    ["Aircraft watched", unique.size, "", "Watched"], ["Airborne now", airborne.size, airborne.size ? "hot" : "", "Airborne"],
    ["Upcoming trips", upcoming, "", "Trips"], ["Alerts · 24 h", alerts, "", "Alerts 24h"],
  ].map(([label, n, cls, short]) => `<div class="stat ${cls}"><b>${n}</b><span class="long">${label}</span><span class="short">${short}</span></div>`).join("");
}

function renderWatchers(d) {
  $("c-watch").textContent = d.watchers.length;
  if (!d.watchers.length) {
    $("watchers").innerHTML = `<div class="card empty">No watchers yet. Add one in TailWatcher → Actions → Configure.</div>`;
    return;
  }
  const sorted = (list) => [...list].sort((a, b) => (b.status === "airborne") - (a.status === "airborne"));
  $("watchers").innerHTML = d.watchers.map((w, wi) => `
    <div class="card watcher">
      <div class="w-head">
        <div class="avatar" style="background:${hue(wi)}">${esc(initials(w.name))}</div>
        <div><div class="w-name">${esc(w.name)}</div><div class="w-topic">${esc(w.topic)}</div></div>
        <div class="w-tags">
          ${w.priority !== "default" ? `<span class="tag accent">${esc(w.priority)} priority</span>` : ""}
          ${w.notify_landing ? `<span class="tag">landings</span>` : ""}
          <button type="button" class="linkbtn" data-act="connect" data-topic="${esc(w.topic)}">Connect phone</button>
          <button type="button" class="linkbtn" data-act="add-aircraft" data-topic="${esc(w.topic)}">+ Aircraft</button>
          <button type="button" class="linkbtn" data-act="edit-watcher" data-topic="${esc(w.topic)}">Edit</button>
        </div>
      </div>
      ${followingHtml(w)}
      ${w.aircraft.length ? sorted(w.aircraft).map((a) => {
        const link = mapLink(a);
        const meta = [
          a.kind === "flight" ? `<span class="tag brand">Flight</span>` : "",
          a.kind === "flight" && a.reg ? `<span>flown by ${esc(a.reg)}</span>` : "",
          a.type ? `<span>${esc(a.type)}</span>` : "",
          a.callsign && a.callsign !== a.ident ? `<span>${esc(a.callsign)}</span>` : "",
          a.expires ? `<span class="chip warn">stops ${until(a.expires)}</span>` : "",
          whereText(a) ? `<span>📍 ${esc(whereText(a))}</span>` : "",
          link ? `<a href="${link}" target="_blank" rel="noopener noreferrer">Live map ↗</a>` : "",
          `<button type="button" class="linkbtn" data-act="edit-aircraft" data-topic="${esc(w.topic)}" data-ident="${esc(a.ident)}">Edit</button>`,
        ].filter(Boolean).join("");
        return `<div class="ac">
          <div class="ac-id">${esc(a.ident)}${a.label ? `<span class="nick">${esc(a.label)}</span>` : ""}</div>
          <div>${statusChip(a)}</div>
          ${meta ? `<div class="ac-meta">${meta}</div>` : ""}
        </div>`;
      }).join("") : `<div class="empty">No aircraft yet. Text a tail number to <code>${esc(w.topic)}</code>.</div>`}
    </div>`).join("");
}

function tripSteps(t) {
  const assigned = !!(t.inbound && (t.inbound.tail || t.inbound.flight));
  const stage = t.landed ? 4 : t.departed ? 3 : assigned ? 2 : 1;
  return `<div class="steps">${["Scheduled", "Plane assigned", "On its way", "At the airport"].map((label, i) =>
    `<div class="step ${i + 1 < stage ? "done" : i + 1 === stage ? "now" : ""}"><i></i>${label}</div>`).join("")}</div>`;
}

function renderTrips(d) {
  const list = d.trips.filter((t) => !t.landed || NOW - (t.dep_time || NOW) < 3 * 3600);
  $("c-trips").textContent = list.length;
  if (!list.length) {
    $("trips").innerHTML = `<div class="empty">No trips. Text <code>inbound UA1234 N38473 dep 4:30pm</code> to follow the plane flying in for your flight.</div>`;
    return;
  }
  $("trips").innerHTML = journeys(list).map((g) => g.length < 2 ? tripCard(g[0])
    : `<div class="journey"><div class="j-head">${journeyHead(g)}</div>${g.map(tripCard).join("")}</div>`).join("");
}

/** "⇄ Round trip · IAD → DEN → LAS ⇄ … · dates" or "🔗 Connecting flights · IAD → DEN → LAS · date". */
function journeyHead(g) {
  const route = (legs) => [legs[0].dep_airport, ...legs.map((t, i) => t.arr_airport || (legs[i + 1] && legs[i + 1].dep_airport) || "?")]
    .map((a) => esc(a || "—")).join(" → ");
  const out = g.filter((t) => t.leg !== "return"), back = g.filter((t) => t.leg === "return");
  const dates = g[0].date === g[g.length - 1].date ? fmtDate(g[0].date) : `${fmtDate(g[0].date)} – ${fmtDate(g[g.length - 1].date)}`;
  if (!back.length) return `🔗 Connecting flights · ${route(out)} · ${dates}`;
  if (out.length < 2 && back.length < 2) return `⇄ Round trip · ${esc(out[0].dep_airport || "—")} ⇄ ${esc(back[0].dep_airport || out[0].arr_airport || "?")} · ${dates}`;
  return `⇄ Round trip · ${route(out)} · back ${route(back)} · ${dates}`;
}

/** Trips with a journey's flights together, in order: [[t], [out, connection, return], …] in list order. */
function journeys(list) {
  const groups = [], seen = new Map();
  for (const t of list) {
    const k = t.itinerary ? `${t.topic}|${t.itinerary}` : null;
    if (k && seen.has(k)) { seen.get(k).push(t); continue; }
    const g = [t];
    groups.push(g);
    if (k) seen.set(k, g);
  }
  const order = (t) => t.seq ?? (t.leg === "return" ? 1 : 0);
  return groups.map((g) => g.sort((a, b) => order(a) - order(b)));
}

/** The other flights of t's journey (round trip, connections) still on the list. */
const othersOf = (t) => t.itinerary ? LAST.trips.filter((x) => x !== t && x.topic === t.topic && x.itinerary === t.itinerary) : [];
const hasReturn = (t) => t.leg === "return" || othersOf(t).some((x) => x.leg === "return");
/** "return", "outbound", "connection" … for a flight's place in its journey. */
function legLabel(t) {
  if (t.connect_from) return "connection";
  if (t.leg === "return") return "return";
  return hasReturn(t) ? "outbound" : "";
}

function tripCard(t) {
  const inb = t.inbound || {};
  const plane = inb.tail || inb.flight;
  const rows = [];
  if (plane) rows.push(["Your plane", `${esc(inb.tail || "")}${inb.tail && inb.flight ? " · " : ""}${esc(inb.flight || "")}${inb.origin ? ` from ${esc(inb.origin)}` : ""}${inb.arr_time ? `, due ${fmtTime(inb.arr_time)}` : ""}`]);
  if (t.departed && !t.landed && t.eta_sent) rows.push(["Arriving", `around ${fmtTime(t.eta_sent)}${t.dep_time ? ` · ${Math.round((t.dep_time - t.eta_sent) / 60)} min before you leave` : ""}`]);
  if (t.connect_from) rows.push(["Connection", `from ${esc(t.connect_from)}${t.connect_at ? ` in ${esc(t.connect_at)}` : ""}${t.connect_min != null ? ` · ${t.connect_min} min` : ""}`]);
  if (t.connect_to) rows.push(["Then", esc(t.connect_to)]);
  if (t.stops && t.stops.length) rows.push(["Stops", esc(t.stops.join(", "))]);
  if (t.shared_names && t.shared_names.length) rows.push(["Shared with", esc(t.shared_names.join(", "))]);
  rows.push(["Source", t.source === "aerodatabox" ? (t.plane_locked ? "AeroDataBox (plane set by you)" : "AeroDataBox") : "Entered by text"]);
  if (t.next_check) rows.push(["Next check", `${until(t.next_check)}${t.last_check ? ` · last ${ago(t.last_check)}` : ""}`]);
  else if (t.last_check) rows.push(["Last checked", ago(t.last_check)]);
  if (t.live && !t.landed) rows.push(["Tracking", `<span class="ok">live on ADS-B</span>`]);
  let banner = "";
  if (t.missing) {
    const r = t.replacement;
    banner = `<div class="banner bad">⚠️ No longer listed. Renumbered or cancelled?${r ? ` Likely now <code>${esc(r.flight)}</code> at ${fmtTime(r.dep_time)}. Text <code>change ${t.number} ${esc(r.flight)}</code> to switch.` : ` Text <code>change ${t.number} NEW123</code> with the new number.`}</div>`;
  } else if (t.late && !t.landed) banner = `<div class="banner bad">⚠️ Your plane may land less than 20 minutes before your departure.</div>`;
  else if (t.tight && !t.landed) banner = `<div class="banner warn">⏳ Tight turnaround: under 45 minutes between your plane landing and your departure.</div>`;
  else if (t.connect_min != null && t.connect_min < 0) banner = `<div class="banner bad">⚠️ ${esc(t.flight)} leaves before ${esc(t.connect_from)} gets in. Check with the airline.</div>`;
  else if (t.connect_min != null && t.connect_min < 40) banner = `<div class="banner warn">⏳ Tight connection: ${t.connect_min} min from ${esc(t.connect_from)} landing to ${esc(t.flight)} leaving.</div>`;
  return `<article class="trip">
    <div class="t-top">
      <span class="t-flight">${esc(t.flight)}</span>
      <span class="t-when">${t.dep_time ? `${fmtDay(t.dep_time)} · ${fmtTime(t.dep_time)}` : fmtDate(t.date)}</span>
      <span class="t-who">${esc(t.watcher)} · trip ${t.number}${legLabel(t) ? " · " + legLabel(t) : ""}</span>
    </div>
    <div class="route">
      <div class="apt">${esc(t.dep_airport || "—")}<small>${t.dep_time ? "departs " + until(t.dep_time) : "departure"}</small></div>
      <div class="line" aria-hidden="true"></div>
      <div class="apt" style="text-align:right">${t.arr_airport ? `${esc(t.arr_airport)}<small>arrival</small>` : `<small>${esc(t.flight)}</small>`}</div>
    </div>
    ${tripSteps(t)}
    <dl class="kv">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
    ${banner}
    <div class="t-actions">${tripButtons(t)}</div>
  </article>`;
}

const ICONS = {alert: "✈️", trip: "🧳", reply: "🤖", command: "💬", test: "🧪", web: "✏️"};
function renderFeed(d) {
  if (!d.history.length) {
    $("feed").innerHTML = `<div class="empty">Nothing yet. Alerts, replies and your text commands will show up here.</div>`;
    return;
  }
  let html = "", lastDay = "";
  for (const e of d.history) {
    const day = dayKey(e.t);
    if (day !== lastDay) { html += `<div class="day">${fmtDay(e.t)}</div>`; lastDay = day; }
    const chip = e.status === "retrying" ? `<span class="chip warn">retrying</span>` : e.status === "refused" ? `<span class="chip bad">refused by NTFY</span>` : "";
    html += `<div class="ev ${e.dir === "in" ? "in" : ""}">
      <div class="ev-icon" aria-hidden="true">${ICONS[e.kind] || "•"}</div>
      <div>

}

/* ---------- board theme ---------- */
let THEME = "modern", LAST = null;
const PREV = {};  // board cell key -> text shown last refresh, to flip only what changed
try { THEME = localStorage.getItem("tw-theme") || "modern"; } catch (e) { /* storage blocked: use default */ }

function flaps(key, text, n, cls = "") {
  const shown = String(text ?? "").toUpperCase().padEnd(n).slice(0, n);
  const before = PREV[key];
  PREV[key] = shown;
  return `<span class="flaps" aria-label="${esc(shown.trim())}">${[...shown].map((ch, i) => {
    const flip = before !== undefined && before[i] !== ch ? " flip" : "";
    const delay = flip ? ` style="animation-delay:${i * 38}ms"` : "";
    return `<span class="flap ${cls}${flip}"${delay} aria-hidden="true">${ch === " " ? "&nbsp;" : esc(ch)}</span>`;
  }).join("")}</span>`;
}
const hhmm = (t, zone) => new Intl.DateTimeFormat("en-GB", {hour: "2-digit", minute: "2-digit", hour12: false, timeZone: zone || TZ}).format(t * 1000);
const mmdd = (t) => new Intl.DateTimeFormat("en-US", {month: "2-digit", day: "2-digit", timeZone: TZ}).format(t * 1000);
const apt = (code) => (code || "").replace(/^K(?=[A-Z]{3}$)/, "");  // KIAD -> IAD, like a real board

function tripStatus(t) {
  const inb = t.inbound || {};
  if (t.missing) return ["RENUMBER", "r"];
  if (t.landed) return ["ARRIVED", "g"];
  if (t.late) return ["AT RISK", "r"];
  if (t.departed && t.tight && t.eta_sent && t.dep_time) return [`TIGHT ${Math.max(0, Math.round((t.dep_time - t.eta_sent) / 60))}M`, "o"];
  if (t.departed) return ["EN ROUTE", "y"];
  if (inb.tail || inb.flight) return ["ASSIGNED", "g"];
  return ["SCHED", ""];
}

function renderTripsBoard(d) {
  const list = d.trips.filter((t) => !t.landed || NOW - (t.dep_time || NOW) < 3 * 3600);
  $("c-trips").textContent = list.length;
  if (!list.length) {
    $("trips").innerHTML = `<div class="empty">No trips. Text <code>inbound UA1234 N38473 dep 4:30pm</code> to follow the plane flying in for your flight.</div>`;
    return;
  }
  const rows = journeys(list).flat().map((t) => {
    const inb = t.inbound || {};
    const k = `trip:${t.topic}:${t.flight}:${t.date}`;
    const when = t.dep_time ? (t.dep_time - NOW < 36 * 3600 ? hhmm(t.dep_time) : mmdd(t.dep_time)) : t.date.slice(5).replace("-", "/");
    const [status, sc] = tripStatus(t);
    const first = othersOf(t).find((x) => x.leg !== "return");
    const sub = t.connect_from ? [`🔗 from ${esc(t.connect_from)}${t.connect_at ? ` at ${esc(apt(t.connect_at))}` : ""}${t.connect_min != null ? ` · <span class="${t.connect_min < 40 ? "o" : ""}">${t.connect_min} min</span>` : ""}`]
      : t.leg === "return" && first ? [`↩ return of ${esc(first.flight)}`] : [];
    if (t.stops && t.stops.length) sub.push(`stops ${esc(t.stops.map(apt).join(", "))}`);
    const route = `<span class="only-narrow">${esc(apt(t.dep_airport) || "—")}→${esc(apt(t.arr_airport) || "?")} · </span>`;
    if (inb.tail || inb.flight) {
      sub.push(`your plane <b>${esc(inb.tail || inb.flight)}</b>${inb.tail && inb.flight ? ` as ${esc(inb.flight)}` : ""}${inb.origin ? ` from ${esc(apt(inb.origin))}` : ""}`);
      if (t.departed && !t.landed && t.eta_sent) sub.push(`due <span class="${sc}">${fmtTime(t.eta_sent)}</span>`);
      else if (inb.arr_time) sub.push(`due ${fmtTime(inb.arr_time)}`);
    } else sub.push("plane not assigned yet");
    if (t.missing && t.replacement) sub.push(`<span class="r">likely now ${esc(t.replacement.flight)}</span> · text <code>change ${t.number} ${esc(t.replacement.flight)}</code>`);
    else if (t.missing) sub.push(`text <code>change ${t.number} NEW123</code> with the new number`);
    if (t.next_check && !t.missing) sub.push(`next check ${until(t.next_check)}`);
    sub.push(esc(t.watcher) + (t.shared_names && t.shared_names.length ? ` → ${esc(t.shared_names.join(", "))}` : ""));
    sub.push(tripButtons(t).replace("</button><button", "</button> · <button"));
    return `<div class="flap-row cols-trip">
        ${flaps(k + ":f", t.flight, 7)}
        <span class="only-wide">${flaps(k + ":to", apt(t.arr_airport) || "", 4)}</span>
        ${flaps(k + ":t", when, 5)}
        ${flaps(k + ":s", status, 9, sc)}
      </div>
      <div class="flap-sub">${route}${sub.join(" · ")}</div>`;
  }).join("");
  $("trips").innerHTML = `<div class="flap-board">
    <div class="flap-head cols-trip"><span>Flight</span><span class="only-wide">To</span><span>Time</span><span>Status</span></div>
    ${rows}</div>`;
}

function fleetStatus(a) {
  if (a.status === "airborne") return [typeof a.alt === "number" ? (a.alt >= 18000 ? "FL" + Math.round(a.alt / 100) : String(Math.round(a.alt / 100) * 100)) : "---", "AIRBORNE", "y"];
  if (a.status === "ground" && a.live) return ["GND", "ON GROUND", "g"];
  if (a.status === "ground") return ["GND", "PARKED", "m"];
  return ["---", "NO SIGNAL", "m"];
}

function renderWatchersBoard(d) {
  $("c-watch").textContent = d.watchers.length;

    $("watchers").innerHTML = `<div class="card empty">No watchers yet. Add one in TailWatcher → Actions → Configure.</div>`;

    const sorted = [...w.aircraft].sort((a, b) => (b.status === "airborne") - (a.status === "airborne"));
    const rows = sorted.map((a) => {
      const k = `ac:${w.topic}:${a.ident}`;
      const [alt, status, sc] = fleetStatus(a);
      const link = mapLink(a);
      const bits = [a.label ? `<b>${esc(a.label)}</b>` : "", a.kind === "flight" && a.reg ? `flown by ${esc(a.reg)}` : "",
        a.type ? esc(a.type) : "", a.status === "airborne" && a.gs ? `${Math.round(a.gs)} kt` : "",
        !a.live && a.last_seen ? esc(`seen ${ago(a.last_seen)}${a.where ? " " + a.where : ""}`) : "",
        a.expires ? `<span class="o">stops ${until(a.expires)}</span>` : "",
        a.live && a.where ? esc(a.where) : "",
        link ? `<a href="${link}" target="_blank" rel="noopener noreferrer">live map ↗</a>` : "",
        `<button type="button" class="linkbtn" data-act="edit-aircraft" data-topic="${esc(w.topic)}" data-ident="${esc(a.ident)}">edit</button>`].filter(Boolean);
      return `<div class="flap-row cols-fleet">${flaps(k + ":id", a.ident, 7)}${flaps(k + ":alt", alt, 5, sc === "y" ? "y" : "")}${flaps(k + ":s", status, 9, sc)}</div>
        <div class="flap-sub">${bits.join(" · ")}</div>`;
    }).join("");
    return `<div class="flap-group">${esc(w.name)} <small>${esc(w.topic)}</small>${w.priority !== "default" ? ` <span class="tag accent">${esc(w.priority)}</span>` : ""}
        <span style="margin-left:auto;display:flex;gap:12px"><button type="button" class="linkbtn" data-act="connect" data-topic="${esc(w.topic)}">connect phone</button><button type="button" class="linkbtn" data-act="add-aircraft" data-topic="${esc(w.topic)}">+ aircraft</button><button type="button" class="linkbtn" data-act="edit-watcher" data-topic="${esc(w.topic)}">edit</button></span></div>
      ${(w.following || []).map((f) => `<div class="flap-sub">📣 following ${esc(f.owner)}'s <b>${esc(f.flight)}</b> · ${followWhen(f)}</div>`).join("")}
      ${rows || (w.following && w.following.length ? "" : `<div class="flap-sub">No aircraft yet. Text a tail number to <code>${esc(w.topic)}</code>.</div>`)}`;
  }).join("");
  $("watchers").innerHTML = `<div class="card flap-board">
    <div class="flap-head cols-fleet"><span>Aircraft</span><span>Alt</span><span>Status</span></div>${groups}</div>`;
}

function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.classList.remove("show"), 4200);
}

async function api(path, body) {
  const url = location.origin + location.pathname.replace(/[^/]*$/, "") + path;
  try {
    const r = await fetch(url, {method: "POST", credentials: "same-origin",
      headers: {"Content-Type": "application/json", "X-TailWatcher": "1"}, body: JSON.stringify(body)});
    const data = await r.json().catch(() => ({ok: false, message: "HTTP " + r.status}));
    return data;
  } catch (err) {
    return {ok: false, message: "Can't reach TailWatcher (" + err.message + ")"};
  }
}

const field = (f) => {
  const id = "f-" + f.name, v = f.value ?? "";
  if (f.type === "checks") return f.options.length ? `<div class="checks" role="group" aria-label="${esc(f.label)}">${esc(f.label)}<div class="opts">${f.options.map(([val, lab]) =>
    `<label><input type="checkbox" name="${f.name}" value="${esc(val)}" ${(v || []).includes(val) ? "checked" : ""}> ${esc(lab)}</label>`).join("")}</div>${f.hint ? `<small>${esc(f.hint)}</small>` : ""}</div>` : "";
  if (f.type === "heading") return `<div class="form-sub">${esc(f.label)}${f.hint ? `<small>${esc(f.hint)}</small>` : ""}</div>`;
  if (f.type === "check") return `<label class="field check"><input type="checkbox" id="${id}" name="${f.name}" ${v ? "checked" : ""}> ${esc(f.label)}</label>`;
  if (f.type === "select") return `<label class="field" for="${id}">${esc(f.label)}<select id="${id}" name="${f.name}">${f.options.map(([val, lab]) => `<option value="${esc(val)}" ${String(val) === String(v) ? "selected" : ""}>${esc(lab)}</option>`).join("")}</select>${f.hint ? `<small>${esc(f.hint)}</small>` : ""}</label>`;
  return `<label class="field" for="${id}">${esc(f.label)}<input id="${id}" name="${f.name}" type="${f.type || "text"}" value="${esc(v)}" ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ""} ${f.required ? "required" : ""} ${f.attrs || ""} autocomplete="off" autocapitalize="${f.caps === false ? "off" : "characters"}" spellcheck="false">${f.hint ? `<small>${esc(f.hint)}</small>` : ""}</label>`;
};

/** Open the shared form. spec: {title, fields (or [a, b] pairs), save(values), remove?/remove2?: {label, confirm, run()}} */
function openForm(spec) {
  const form = $("dlg-form");
  form.innerHTML = `<h3 id="dlg-title">${esc(spec.title)}</h3>
    ${spec.fields.map((f) => Array.isArray(f) ? `<div class="two">${f.map(field).join("")}</div>` : field(f)).join("")}
    <div class="form-error" id="dlg-err" role="alert"></div>
    <div class="dlg-actions">
      ${spec.remove ? `<button type="button" class="btn danger" id="dlg-remove">${esc(spec.remove.label)}</button>` : ""}
      ${spec.remove2 ? `<button type="button" class="btn danger" id="dlg-remove2">${esc(spec.remove2.label)}</button>` : ""}
      <button type="button" class="btn" id="dlg-cancel">Close</button>
      <button type="submit" class="btn primary">${esc(spec.saveLabel || "Save")}</button>
    </div>`;
  const dlg = $("dlg");
  const done = async (result) => {
    if (result.ok) { dlg.close(); toast(result.message); load(); }
    else $("dlg-err").textContent = result.message;
  };
  form.onsubmit = async (e) => {
    e.preventDefault();
    const missing = [...form.querySelectorAll("[required]")].find((el) => !el.value.trim());
    if (missing) { $("dlg-err").textContent = "Fill in " + missing.closest("label").firstChild.textContent.trim() + "."; missing.focus(); return; }
    const values = {};
    for (const el of form.elements) {
      if (!el.name) continue;
      if (el.type === "checkbox" && el.value !== "on") { (values[el.name] ||= []).push(...(el.checked ? [el.value] : [])); continue; }
      values[el.name] = el.type === "checkbox" ? el.checked : el.value.trim();
    }
    form.querySelector("[type=submit]").disabled = true;
    await done(await spec.save(values));
    form.querySelector("[type=submit]").disabled = false;
  };
  form.oninput = () => { $("dlg-err").textContent = ""; };
  $("dlg-cancel").onclick = () => dlg.close();
  if (spec.remove) $("dlg-remove").onclick = async () => { if (confirm(spec.remove.confirm)) await done(await spec.remove.run()); };
  if (spec.remove2) $("dlg-remove2").onclick = async () => { if (confirm(spec.remove2.confirm)) await done(await spec.remove2.run()); };
  dlg.showModal();
  const first = form.querySelector("input, select");
  if (first && matchMedia("(hover: hover)").matches) first.focus();
}

const watcherOptions = () => LAST.watchers.map((w) => [w.topic, w.name]);
const slug = (s) => s.toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "");
const localDate = (t) => new Intl.DateTimeFormat("en-CA", {timeZone: TZ}).format(t * 1000);

function tripForm(t, pre, intro) {
  const inb = (t && t.inbound) || {};
  const adb = LAST.settings.aerodatabox;
  const others = t ? othersOf(t) : [];
  const canAddReturn = !t || !hasReturn(t);
  const canConnect = !t || !t.connect_to;
  const connFields = (prefix, label, hint) => [
    {type: "heading", label, hint},
    [{name: prefix + "flight", label: "Connecting flight", placeholder: "UA567"},
     {name: prefix + "time", label: "Departs", type: "time", hint: adb ? "Optional with AeroDataBox" : "Local time where it leaves"}],
    {name: prefix + "plane", label: "Plane flying in", placeholder: "N12345 or UA890", hint: adb ? "Leave blank and AeroDataBox finds it." : "Fill in nearer the day (Edit the connection)."},
  ];
  const fields = [
    ...(intro ? [intro] : []),
    ...(t ? [] : [{name: "topic", label: "For", type: "select", options: watcherOptions()}]),
    [{name: "flight", label: "Your flight", value: t ? t.flight : "", placeholder: "UA1234", required: true},
     {name: "date", label: "Date", type: "date", value: t ? t.date : localDate(NOW)}],
    [{name: "time", label: "Departs", type: "time", value: t && t.dep_time ? hhmm(t.dep_time, t.dep_tz) : "", hint: adb && !t ? "Optional with AeroDataBox" : "Local time where it leaves"},
     {name: "airport", label: "From airport", value: t ? apt(t.dep_airport) : "", placeholder: "IAD", hint: "Optional"}],
    {name: "to", label: "Getting off at", value: t ? apt(t.get_off) : "", placeholder: "DEN", hint: "Optional: only for a flight that stops on the way and you get off early"},
    {name: "plane", label: "Plane flying in", value: inb.tail || inb.flight || "", placeholder: "N38473 or UA567",
     hint: adb ? "Leave blank and AeroDataBox finds it. See ? Help → Trips." : "From your airline app's \"Where's my plane?\" screen. See ? Help → Trips."},
    ...(canConnect ? connFields("conn_", "Connecting flight", "Optional: the next flight after this one. I'll tell you how long you'll have to make it.") : []),
    ...(canAddReturn ? [
      {type: "heading", label: "Return flight", hint: "Optional: your flight home, tracked as part of the same trip."},
      [{name: "ret_flight", label: "Return flight", placeholder: "UA5678"},
       {name: "ret_date", label: "Date", type: "date"}],
      [{name: "ret_time", label: "Departs", type: "time", hint: adb ? "Optional with AeroDataBox" : "Local time where it leaves"},
       {name: "ret_airport", label: "From airport", placeholder: "LAS", hint: "Blank: where you land"}],
      {name: "ret_plane", label: "Plane flying in", placeholder: "N12345 or UA567", hint: adb ? "Leave blank and AeroDataBox finds it." : "Fill in nearer the day (Edit the return)."},
      ...(t ? [] : connFields("ret_conn_", "Return connection", "Optional: the next flight after the return.")),
    ] : []),
    {name: "share", label: "Share with", type: "checks", value: t ? t.shared_with : [],
     options: LAST.watchers.filter((w) => !t || w.topic !== t.topic).map((w) => [w.topic, w.name]),
     hint: others.length ? `Covers every flight of this trip (${[t, ...others].map((x) => x.flight).join(", ")}). They get each flight's departure and landing, nothing else.`
       : "They get your flight's departure and landing, nothing else."},
  ];
  if (pre) for (const f of fields.flat()) if (f.name && f.name in pre) f.value = pre[f.name];
  if (!t) return openForm({title: pre ? "Check your imported trip" : "Add trip", fields, saveLabel: "Add trip",
    save: (v) => api("api/trip", {op: "add", ...v, share: (v.share || []).filter((x) => x !== v.topic)})});
  const before = {flight: t.flight, date: t.date, time: t.dep_time ? hhmm(t.dep_time, t.dep_tz) : "", airport: apt(t.dep_airport), to: apt(t.get_off), plane: inb.tail || inb.flight || ""};
  openForm({title: `Edit ${t.flight} · ${t.watcher}`, fields,
    save: (v) => {
      const {share = [], ...rest} = v;
      const changes = Object.fromEntries(Object.entries(rest).filter(([k, val]) => val && val !== before[k]));
      const shareChanged = share.slice().sort().join() !== (t.shared_with || []).slice().sort().join();
      if (!Object.keys(changes).length && !shareChanged) return Promise.resolve({ok: true, message: "Nothing changed."});
      return api("api/trip", {op: "change", topic: t.topic, number: t.number, ...changes, ...(shareChanged ? {share} : {})});
    },
    remove: others.length
      ? {label: others.length > 1 ? "Cancel all" : "Cancel both", confirm: `Stop tracking ${[t, ...others].map((x) => x.flight).join(", ")}?`, run: () => api("api/trip", {op: "cancel", topic: t.topic, number: t.number})}
      : {label: "Cancel trip", confirm: `Stop tracking ${t.flight}?`, run: () => api("api/trip", {op: "cancel", topic: t.topic, number: t.number})},
    remove2: others.length ? {label: `Cancel ${t.flight}`, confirm: `Stop tracking ${t.flight} and keep ${others.map((x) => x.flight).join(", ")}?`,
      run: () => api("api/trip", {op: "cancel", topic: t.topic, number: t.number, only: true})} : null});
}

    const day = (d) => d ? new Date(d + "T12:00:00Z").toLocaleDateString(undefined, {weekday: "short", month: "short", day: "numeric", timeZone: "UTC"}) : "date?";
    const found = r.flights.map((f) => `${f.flight} ${day(f.date)}${f.time ? " " + f.time : ""}${f.dep ? " " + f.dep : ""}${f.arr ? "→" + f.arr : ""}`);

      hint: [...found, ...r.notes].join("\n")});
  };
  $("dlg").showModal();
  if (matchMedia("(hover: hover)").matches) $("imp-text").focus();
}

/* ---------- help ---------- */
let GUIDE = null;  // [{id, level, title, html, text}] parsed from guide.md (the StartOS instructions)
const slugify = (t) => t.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

function inline(text) {
  // text is already HTML-escaped
  return text.replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
}

/** A small Markdown subset: headings, paragraphs, lists (one nesting level), tables, quotes. */
function renderBlocks(lines) {
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }
    if (line.startsWith("|")) {
      const rows = [];
      while (i < lines.length && lines[i].startsWith("|")) rows.push(lines[i++]);
      const cells = (r) => r.replace(/^\||\|$/g, "").split("|").map((c) => inline(esc(c.trim())));
      const body = rows.filter((r) => !/^\|[\s|:-]+\|$/.test(r));
      out.push(`<table><thead><tr>${cells(body[0]).map((c) => `<th>${c}</th>`).join("")}</tr></thead><tbody>${body.slice(1).map((r) => `<tr>${cells(r).map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`);
      continue;
    }
    if (line.startsWith(">")) {
      const q = [];
      while (i < lines.length && lines[i].startsWith(">")) q.push(inline(esc(lines[i++].replace(/^>\s?/, ""))));
      out.push(`<blockquote>${q.join("<br>")}</blockquote>`);
      continue;
    }
    const ordered = /^\d+\.\s/.test(line);
    if (ordered || /^-\s/.test(line)) {
      const items = [];
      while (i < lines.length && (/^(\d+\.|-)\s/.test(lines[i]) || /^\s{2,}\S/.test(lines[i]))) {
        if (/^\s{2,}-\s/.test(lines[i]) && items.length) (items[items.length - 1].sub ||= []).push(lines[i].trim().replace(/^-\s/, ""));
        else if (/^\s{2,}\S/.test(lines[i]) && items.length) items[items.length - 1].text += " " + lines[i].trim();
        else items.push({text: lines[i].replace(/^(\d+\.|-)\s/, "")});
        i++;
      }
      const tag = ordered ? "ol" : "ul";
      out.push(`<${tag}>${items.map((it) => `<li>${inline(esc(it.text))}${it.sub ? `<ul>${it.sub.map((x) => `<li>${inline(esc(x))}</li>`).join("")}</ul>` : ""}</li>`).join("")}</${tag}>`);
      continue;
    }
    const para = [];
    while (i < lines.length && lines[i].trim() && !/^(#|\||>|-\s|\d+\.\s)/.test(lines[i])) para.push(lines[i++]);
    out.push(`<p>${inline(esc(para.join(" ")))}</p>`);
  }
  return out.join("");
}

function parseGuide(md) {
  const sections = [];
  let cur = null;
  for (const line of md.split("\n")) {
    const h = /^(#{2,3})\s+(.*)$/.exec(line);
    if (h) {
      cur = {id: slugify(h[2]), level: h[1].length, title: h[2], lines: []};
      sections.push(cur);
    } else if (cur) cur.lines.push(line);
  }
  return sections.map((sec) => ({...sec, html: renderBlocks(sec.lines),
    text: (sec.title + " " + sec.lines.join(" ")).replace(/[`*|>#]/g, " ").replace(/\s+/g, " ")}));
}

  const form = $("dlg-form"), dlg = $("dlg");

    <div class="guide" id="guide">Loading…</div>
    <div class="dlg-actions"><button type="button" class="btn" id="dlg-cancel">Close</button></div>`;
  form.onsubmit = (e) => e.preventDefault();
  $("dlg-cancel").onclick = () => dlg.close();
  dlg.addEventListener("close", () => dlg.classList.remove("help"), {once: true});
  dlg.showModal();
  if (!GUIDE) {
    try {
      const url = location.origin + location.pathname.replace(/[^/]*$/, "") + "guide.md";
      const r = await fetch(url, {cache: "no-store", credentials: "same-origin"});
      if (!r.ok) throw new Error("HTTP " + r.status);
      GUIDE = parseGuide(await r.text());
    } catch (err) {
      $("guide").textContent = "Couldn't load the guide (" + err.message + "). It's also under Instructions in StartOS.";
      return;
    }
  }
  $("help-toc").innerHTML = GUIDE.filter((x) => x.level === 2).map((x) => `<a href="#h-${x.id}" data-help-jump="${x.id}">${esc(x.title)}</a>`).join("");
  $("guide").innerHTML = GUIDE.map((x) => `<section id="h-${x.id}" data-level="${x.level}">
      ${x.id === "for-people-getting-alerts" ? `<button type="button" class="btn copy-for" id="help-copy">Copy for them</button>` : ""}
      <h${x.level}>${esc(x.title)}</h${x.level}>${x.html}</section>`).join("");
  $("help-toc").onclick = (e) => {
    const a = e.target.closest("[data-help-jump]");
    if (a) { e.preventDefault(); $("help-q").value = ""; filterHelp(""); jumpTo(a.dataset.helpJump); }
  };
  if ($("help-copy")) $("help-copy").onclick = async () => {
    const sec = GUIDE.find((x) => x.id === "for-people-getting-alerts");
    const text = sec.lines.filter((l) => !l.startsWith("*A short")).join("\n").replace(/\*\*|`/g, "").trim();
    try { await navigator.clipboard.writeText("TailWatcher alerts\n\n" + text); toast("Copied. Paste it into a message to them."); }
    catch (e) { toast("Couldn't copy here; select the text instead."); }
  };
  $("help-q").oninput = (e) => filterHelp(e.target.value);
  if (target && $("h-" + target)) jumpTo(target);
  else if (matchMedia("(hover: hover)").matches) $("help-q").focus();
}

function jumpTo(id) {
  // Scroll only the guide (scrollIntoView would also scroll the dialog and page).
  const g = $("guide"), sec = $("h-" + id);
  g.scrollTop += sec.getBoundingClientRect().top - g.getBoundingClientRect().top;
}

function filterHelp(q) {
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  let shown = 0, parent = null;
  for (const x of GUIDE) {
    const el = $("h-" + x.id);
    if (x.level === 2) parent = el;
    const hit = !words.length || words.every((w) => x.text.toLowerCase().includes(w));
    el.classList.toggle("hidden", !hit);
    if (hit) { shown++; if (x.level === 3 && parent) parent.classList.remove("hidden"); }
    el.querySelectorAll("mark").forEach((m) => m.replaceWith(m.textContent));
    if (hit && words.length) highlight(el, words);
  }
  const none = $("help-none");
  if (!shown && !none) $("guide").insertAdjacentHTML("beforeend", `<p id="help-none" class="muted">Nothing found. Try another word, or browse the topics above.</p>`);
  else if (shown && none) none.remove();
}

function highlight(root, words) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  const re = new RegExp("(" + words.map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
  for (const n of nodes) {
    if (!re.test(n.nodeValue) || n.parentNode.closest("button")) continue;
    re.lastIndex = 0;
    const span = document.createElement("span");
    span.innerHTML = esc(n.nodeValue).replace(re, "<mark>$1</mark>");
    n.replaceWith(...span.childNodes);
  }
}

      <div class="two">
        <label class="field">ADS-B feed ${sel("dataSource", s.data_source, [["adsb.fi", "adsb.fi"], ["adsb.lol", "adsb.lol"]])}</label>
        <label class="field">Check every (seconds)<input name="pollSeconds" type="number" min="15" max="600" value="${s.poll_seconds}" inputmode="numeric"></label>
      </div>
    </div>
    <div class="set-section"><h4>Display and access</h4>
      <div class="two">
        <label class="field">Time zone ${sel("timeZone", s.time_zone, s.time_zones)}</label>
        <label class="field">Map buttons ${sel("mapLinks", s.map_links, [["adsbx", "ADS-B Exchange"], ["adsblol", "adsb.lol"], ["both", "Both"]])}</label>
      </div>
      <label class="field check"><input type="checkbox" name="textCommands" ${s.text_commands ? "checked" : ""}> Text commands (people manage their list by typing in their topic)</label>
      <label class="field check"><input type="checkbox" name="webPassword" ${s.web_password ? "checked" : ""}> Require a password for this page</label>
      <div class="note" id="s-pw-note" ${s.web_password ? "hidden" : ""}>If you turn this on, get the password first from StartOS → TailWatcher → Actions → Show Web UI Password.</div>
    </div>
    <div class="form-error" id="dlg-err" role="alert"></div>
    <div class="dlg-actions"><button type="button" class="btn" id="dlg-cancel">Close</button><button type="submit" class="btn primary">Save settings</button></div>`;

  const show = () => {
    const v = form.querySelector('input[name="ntfyServer"]:checked').value;
    $("p-local").hidden = v !== "local";
    $("p-custom").hidden = v !== "custom";
  };
  form.querySelectorAll('input[name="ntfyServer"]').forEach((el) => el.addEventListener("change", show));
  $("dlg-cancel").onclick = () => $("dlg").close();
  form.oninput = () => { $("dlg-err").textContent = ""; };

  $("s-setup").onclick = async () => {
    const btn = $("s-setup"), out = $("s-setup-result");
    btn.disabled = true; btn.textContent = "Setting up…";
    const r = await api("api/ntfy-setup", {adminPassword: $("s-admin").value, phones: form.querySelector('input[name="phones"]:checked').value});
    btn.disabled = false; btn.textContent = "Set up NTFY for me";
    $("s-admin").value = "";
    out.innerHTML = r.ok ? `<ul class="steps-done">${(r.steps || []).map((x) => `<li>${esc(x)}</li>`).join("")}</ul>${credsHtml(r.logins || [])}`
      : `<div class="form-error">${esc(r.message)}</div>`;
    if (r.ok) { toast("NTFY is set up."); load(); }
  };

  form.onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(form), body = {};
    body.ntfyServer = f.get("ntfyServer");
    if (body.ntfyServer === "custom") { body.ntfyCustomUrl = (f.get("ntfyCustomUrl") || "").trim(); if (f.get("ntfyToken")) body.ntfyToken = f.get("ntfyToken").trim(); }
    if (body.ntfyServer === "local" && !(s.ntfy_server === "local" && s.ntfy_token_set) && !confirm("You haven't run \"Set up NTFY for me\" yet. Switch to this server's NTFY anyway?")) return;
    if (f.get("aerodataboxKey")) body.aerodataboxKey = f.get("aerodataboxKey").trim();
    if (f.get("clearAerodatabox")) body.clearAerodatabox = true;
    Object.assign(body, {dataSource: f.get("dataSource"), pollSeconds: f.get("pollSeconds"), timeZone: f.get("timeZone"),
      mapLinks: f.get("mapLinks"), textCommands: !!f.get("textCommands"), webPassword: !!f.get("webPassword")});
    const r = await api("api/settings", body);
    if (r.ok) { $("dlg").close(); toast(r.message); load(); } else $("dlg-err").textContent = r.message;
  };
  $("dlg").addEventListener("close", () => $("dlg").classList.remove("wide"), {once: true});
  $("dlg").showModal();
}

function onAction(btn) {
  if (!LAST) return;
  const {act, topic, number, ident} = btn.dataset;
  const w = LAST.watchers.find((x) => x.topic === topic);
  const t = LAST.trips.find((x) => x.topic === topic && String(x.number) === number);
  if (act === "add-trip") {
    if (!LAST.watchers.length) return toast("Add a watcher first.");
    return tripForm(null);
  }
  if (act === "import-trip") {
    if (!LAST.watchers.length) return toast("Add a watcher first.");
    return importForm();
  }
  if (act === "edit-trip" && t) return tripForm(t);
  if (act === "cancel-trip" && t) {
    const p = othersOf(t);
    if (confirm(p.length ? `Stop tracking ${[t, ...p].map((x) => x.flight).join(", ")}? (To keep some, use Edit.)` : `Stop tracking ${t.flight}?`)) api("api/trip", {op: "cancel", topic, number: t.number}).then((r) => { toast(r.message); load(); });
    return;
  }
  if (act === "add-watcher") return watcherForm(null);
  if (act === "connect" && w) return connectPhone(w);
  if (act === "settings") return openSettings();
  if (act === "help") return openHelp(btn.dataset.section);
  if (act === "edit-watcher" && w) return watcherForm(w);
  if (act === "add-aircraft" && w) return aircraftForm(w, null);
  if (act === "edit-aircraft" && w) return aircraftForm(w, w.aircraft.find((a) => a.ident === ident));
}

function applyTheme(theme, rerender) {
  THEME = theme === "board" ? "board" : "modern";
  document.body.classList.toggle("theme-board", THEME === "board");
  document.querySelector('meta[name="theme-color"]').content = THEME === "board" ? "#08090b" : "#0e2546";
  document.querySelectorAll(".themes button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.theme === THEME)));
  try { localStorage.setItem("tw-theme", THEME); } catch (e) { /* storage blocked: still switches for this visit */ }
  if (rerender && LAST) { for (const k in PREV) delete PREV[k]; render(LAST); }
}

function render(d) {
  LAST = d;
  TZ = d.time_zone; NOW = d.now; lastLoad = Date.now();
  $("dot").className = "dot " + (d.health.ok ? "" : "bad");
  $("statusText").textContent = d.health.message || (d.health.ok ? "Watching" : "Needs attention");
  renderStats(d);
  if (THEME === "board") { renderTripsBoard(d); renderWatchersBoard(d); } else { renderTrips(d); renderWatchers(d); }
  renderFeed(d); renderSystem(d);
  $("foot").innerHTML = `TailWatcher ${esc(d.version)} · times in ${esc(d.time_zone.replace("_", " "))} · updates every 20 s · <button type="button" class="linkbtn" data-act="help">Help</button>`;
}

async function load() {
  try {
    // Built from origin + path: a page opened as https://user:pass@host/ would
    // otherwise hand its credentials to fetch(), which refuses them.
    const url = location.origin + location.pathname.replace(/[^/]*$/, "") + "api/state";
    const r = await fetch(url, {cache: "no-store", credentials: "same-origin"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    render(await r.json());
  } catch (err) {
    $("dot").className = "dot bad";
    $("statusText").textContent = "Can't reach TailWatcher (" + err.message + ")";
  }
}

document.addEventListener("click", (e) => {
  if (e.target.classList.contains("ev-msg")) e.target.classList.toggle("open");
  const b = e.target.closest(".themes button");
  if (b) applyTheme(b.dataset.theme, true);
  const act = e.target.closest("[data-act]");
  if (act) onAction(act);
});
applyTheme(THEME, false);
document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - lastLoad > 15000) load(); });
setInterval(() => { if (!document.hidden) load(); }, 20000);
load();
</script>
</body>
</html>
