  });
  if ($("cp-login")) $("cp-login").onclick = async () => {
    const r = await api("api/ntfy-login", {topic: w.topic, adminPassword: $("cp-admin").value});
    $("cp-admin").value = "";
    $("cp-login-out").innerHTML = r.ok ? credsHtml(r.logins) : `<div class="form-error">${esc(r.message)}</div>`;
  };
  if (info) {
    $("cp-copy").onclick = async () => {
      try { await navigator.clipboard.writeText(info.app); toast("Link copied."); }
      catch (e) { toast("Couldn't copy. Press and hold the link instead."); }
    };
    $("cp-share").onclick = async () => {
      if (navigator.share) { try { await navigator.share({title: "TailWatcher alerts", text: message}); } catch (e) { /* cancelled */ } }
      else { try { await navigator.clipboard.writeText(message); toast("Message copied. Paste it into a text to them."); } catch (e) { toast("Copy the link above and text it to them."); } }
    };
  }
  $("dlg").showModal();
}

/* ---------- help ---------- */
let GUIDE = null;  // [{id, level, title, html, text}] parsed from guide.md (the StartOS instructions)
const slugify = (t) => t.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

function inline(text) {
  // text is already HTML-escaped
  return text.replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
}

/** A small Markdown subset: headings, paragraphs, lists (one nesting level), tables, quotes. */
function renderBlocks(lines) {
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }
    if (line.startsWith("|")) {
      const rows = [];
      while (i < lines.length && lines[i].startsWith("|")) rows.push(lines[i++]);
      const cells = (r) => r.replace(/^\||\|$/g, "").split("|").map((c) => inline(esc(c.trim())));
      const body = rows.filter((r) => !/^\|[\s|:-]+\|$/.test(r));
      out.push(`<table><thead><tr>${cells(body[0]).map((c) => `<th>${c}</th>`).join("")}</tr></thead><tbody>${body.slice(1).map((r) => `<tr>${cells(r).map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`);
      continue;
    }
    if (line.startsWith(">")) {
      const q = [];
      while (i < lines.length && lines[i].startsWith(">")) q.push(inline(esc(lines[i++].replace(/^>\s?/, ""))));
      out.push(`<blockquote>${q.join("<br>")}</blockquote>`);
      continue;
    }
    const ordered = /^\d+\.\s/.test(line);
    if (ordered || /^-\s/.test(line)) {
      const items = [];
      while (i < lines.length && (/^(\d+\.|-)\s/.test(lines[i]) || /^\s{2,}\S/.test(lines[i]))) {
        if (/^\s{2,}-\s/.test(lines[i]) && items.length) (items[items.length - 1].sub ||= []).push(lines[i].trim().replace(/^-\s/, ""));
        else if (/^\s{2,}\S/.test(lines[i]) && items.length) items[items.length - 1].text += " " + lines[i].trim();
        else items.push({text: lines[i].replace(/^(\d+\.|-)\s/, "")});
        i++;
      }
      const tag = ordered ? "ol" : "ul";
      out.push(`<${tag}>${items.map((it) => `<li>${inline(esc(it.text))}${it.sub ? `<ul>${it.sub.map((x) => `<li>${inline(esc(x))}</li>`).join("")}</ul>` : ""}</li>`).join("")}</${tag}>`);
      continue;
    }
    const para = [];
    while (i < lines.length && lines[i].trim() && !/^(#|\||>|-\s|\d+\.\s)/.test(lines[i])) para.push(lines[i++]);
    out.push(`<p>${inline(esc(para.join(" ")))}</p>`);
  }
  return out.join("");
}

function parseGuide(md) {
  const sections = [];
  let cur = null;
  for (const line of md.split("\n")) {
    const h = /^(#{2,3})\s+(.*)$/.exec(line);
    if (h) {
      cur = {id: slugify(h[2]), level: h[1].length, title: h[2], lines: []};
      sections.push(cur);
    } else if (cur) cur.lines.push(line);
  }
  return sections.map((sec) => ({...sec, html: renderBlocks(sec.lines),
    text: (sec.title + " " + sec.lines.join(" ")).replace(/[`*|>#]/g, " ").replace(/\s+/g, " ")}));
}

// Help is its own full window: the URL becomes #help/<section>, so Back closes
// it, a section can be bookmarked or opened in a new tab, and a page loaded
// with #help opens straight into it.
let HELP_PUSHED = false;  // we added the #help history entry (so closing goes Back)
const helpHash = () => { const m = /^#help(?:\/([a-z0-9-]*))?$/.exec(location.hash); return m ? (m[1] || "") : null; };

async function openHelp(target) {
  const dlg = $("help");
  if (!dlg.open) {
    dlg.innerHTML = `<div class="hp-bar">
        <button type="button" class="btn" id="help-close">← Back</button>
        <h3 id="help-title">Help</h3>
        <button type="button" class="btn hp-contents" id="help-contents" aria-expanded="false" aria-controls="help-toc">☰ Contents</button>
        <input type="search" id="help-q" placeholder="Search the guide, e.g. iphone, renumbered, share" aria-label="Search the guide" autocomplete="off">
        <a class="hp-tab" id="help-tab" href="#help" target="_blank" rel="noopener">Open in new tab ↗</a>
      </div>
      <div class="hp-body" id="help-body">
        <nav class="hp-toc" id="help-toc" aria-label="Contents"></nav>
        <div class="hp-main" id="help-main"><div class="guide" id="guide">Loading…</div></div>
      </div>`;
    $("help-close").onclick = () => dlg.close();
    $("help-contents").onclick = () => toggleToc();
    dlg.showModal();
    if (helpHash() === null) { history.pushState(null, "", "#help" + (target ? "/" + target : "")); HELP_PUSHED = true; }
  }
  if (!GUIDE) {
    try {
      const url = location.origin + location.pathname.replace(/[^/]*$/, "") + "guide.md";
      const r = await fetch(url, {cache: "no-store", credentials: "same-origin"});
      if (!r.ok) throw new Error("HTTP " + r.status);
      GUIDE = parseGuide(await r.text());
    } catch (err) {
      $("guide").textContent = "Couldn't load the guide (" + err.message + ")." + (docker() ? "" : " It's also under Instructions in StartOS.");
      return;
    }
  }
  if (!dlg.open) return;  // closed while the guide was loading
  if (!$("guide").dataset.ready) renderHelp();
  if (target && $("h-" + target)) { $("help-q").value = ""; filterHelp(""); jumpTo(target); }
  else if (!target && matchMedia("(hover: hover)").matches) $("help-q").focus();
}

function renderHelp() {
  const g = $("guide");
  g.dataset.ready = "1";
  // Contents: every ## topic, with its ### questions nested under it.
  const tops = [];
  for (const x of GUIDE) if (x.level === 2 || !tops.length) tops.push({...x, subs: []}); else tops[tops.length - 1].subs.push(x);
  const link = (x) => `<a href="#help/${x.id}" data-help-jump="${x.id}">${esc(x.title)}</a>`;
  $("help-toc").innerHTML = `<ul>${tops.map((t) => `<li id="toc-${t.id}">${link(t)}${t.subs.length ? `<ul>${t.subs.map((s) => `<li id="toc-${s.id}">${link(s)}</li>`).join("")}</ul>` : ""}</li>`).join("")}</ul>`;
  g.innerHTML = GUIDE.map((x) => `<section id="h-${x.id}" data-level="${x.level}">
      ${x.id === "for-people-getting-alerts" ? `<button type="button" class="btn copy-for" id="help-copy">Copy for them</button>` : ""}
      <h${x.level}>${esc(x.title)}</h${x.level}>${x.html}</section>`).join("");
  $("help-toc").onclick = (e) => {
    const a = e.target.closest("[data-help-jump]");
    if (!a || e.metaKey || e.ctrlKey || e.shiftKey) return;  // modified clicks open a new tab as usual
    e.preventDefault(); $("help-q").value = ""; filterHelp(""); toggleToc(false); jumpTo(a.dataset.helpJump);
  };
  if ($("help-copy")) $("help-copy").onclick = async () => {
    const sec = GUIDE.find((x) => x.id === "for-people-getting-alerts");
    const text = sec.lines.filter((l) => !l.startsWith("*A short")).join("\n").replace(/\*\*|`/g, "").trim();
    try { await navigator.clipboard.writeText("TailWatcher alerts\n\n" + text); toast("Copied. Paste it into a message to them."); }
    catch (e) { toast("Couldn't copy here; select the text instead."); }
  };
  $("help-q").oninput = (e) => filterHelp(e.target.value);
  $("help-main").onscroll = () => markCurrent();
  markCurrent();
}

function toggleToc(open) {
  const body = $("help-body"), on = open ?? !body.classList.contains("toc-open");
  body.classList.toggle("toc-open", on);
  $("help-contents").setAttribute("aria-expanded", String(on));
}

function jumpTo(id) {
  // Scroll only the guide's own pane (scrollIntoView would also scroll the page).
  const m = $("help-main"), sec = $("h-" + id);
  m.scrollTop += sec.getBoundingClientRect().top - m.getBoundingClientRect().top - 8;
  history.replaceState(null, "", "#help/" + id);
  markCurrent(id);
}

function markCurrent(id) {
  // The section at the top of the pane gets highlighted in Contents.
  if (!GUIDE || !$("help-main")) return;
  if (!id) {
    const top = $("help-main").getBoundingClientRect().top + 40;
    for (const x of GUIDE) {
      const el = $("h-" + x.id);
      if (!el.classList.contains("hidden") && el.getBoundingClientRect().top <= top) id = x.id;
    }
    id ||= GUIDE[0].id;
  }
  $("help-toc").querySelectorAll("a[aria-current]").forEach((a) => a.removeAttribute("aria-current"));
  const a = $("help-toc").querySelector(`#toc-${id} > a`);
  if (a) { a.setAttribute("aria-current", "true"); if (!$("help-body").classList.contains("toc-open")) keepVisible(a); }
  $("help-tab").href = "#help/" + id;
}

function keepVisible(a) {
  const toc = $("help-toc"), r = a.getBoundingClientRect(), box = toc.getBoundingClientRect();
  if (r.top < box.top) toc.scrollTop -= box.top - r.top + 8;
  else if (r.bottom > box.bottom) toc.scrollTop += r.bottom - box.bottom + 8;
}

function filterHelp(q) {
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  let shown = 0, parent = null, parentToc = null;
  for (const x of GUIDE) {
    const el = $("h-" + x.id), li = $("toc-" + x.id);
    if (x.level === 2) { parent = el; parentToc = li; }
    const hit = !words.length || words.every((w) => x.text.toLowerCase().includes(w));
    el.classList.toggle("hidden", !hit);
    if (li) li.classList.toggle("hidden", !hit);
    if (hit) {
      shown++;
      if (x.level === 3) { if (parent) parent.classList.remove("hidden"); if (parentToc) parentToc.classList.remove("hidden"); }
    }
    el.querySelectorAll("mark").forEach((m) => m.replaceWith(m.textContent));
    if (hit && words.length) highlight(el, words);
  }
  const none = $("help-none");
  if (!shown && !none) $("guide").insertAdjacentHTML("beforeend", `<p id="help-none" class="muted">Nothing found. Try another word, or browse the Contents.</p>`);
  else if (shown && none) none.remove();
  if (words.length) $("help-main").scrollTop = 0;
  markCurrent();
}

function highlight(root, words) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  const re = new RegExp("(" + words.map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
  for (const n of nodes) {
    if (!re.test(n.nodeValue) || n.parentNode.closest("button")) continue;
    re.lastIndex = 0;
    const span = document.createElement("span");
    span.innerHTML = esc(n.nodeValue).replace(re, "<mark>$1</mark>");
    n.replaceWith(...span.childNodes);
  }
}

/* ---------- settings ---------- */
const sel = (name, value, options) => `<select id="s-${name}" name="${name}">${options.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === String(value) ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
const radio = (name, value, current, title, hint) => `<label class="radio-card"><input type="radio" name="${name}" value="${value}" ${value === current ? "checked" : ""}><span>${title}</span><small>${hint}</small></label>`;
const credsHtml = (logins) => logins.map((l) => `<div class="creds">${esc(l.name)} · user <b>${esc(l.username)}</b> · password <b>${esc(l.password)}</b></div>`).join("")
  + (logins.length ? `<div class="note">Shown once. In the ntfy app: Settings → Manage users → add this server with that login.</div>` : "");

/* ---------- signing in ---------- */
/** The three sign-in choices, shared by first setup and ⚙ Settings. */
function signInChoices(current, hasAccounts) {
  const where = docker() ? "TailWatcher's container log (or docker exec tailwatcher python /app/tailwatcher.py password)" : "StartOS → TailWatcher → Actions → Show Web UI Password";
  return radio("webAuth", "off", current, "No sign-in", docker() ? "Anyone who can reach this page can use it. Only if its port isn't open to the internet." : "Anyone who can reach this page can use it: your home network and VPN, unless you gave it a public address.")
    + radio("webAuth", "password", current, "One shared password", `Everyone in the household uses the same password, from ${where}.`)
    + radio("webAuth", "accounts", current, "Family accounts", "Each person signs in with their own username and sees only their own watchers and trips. They can still share trips with each other. Admins manage people and settings, but can't see anyone else's trips.")
    + (hasAccounts ? "" : `<div class="sub-panel" id="p-accounts" ${current === "accounts" ? "" : "hidden"}>
        <div class="status-line">You'll be the first admin. Pick your sign-in:</div>
        <div class="two"><label class="field">Your name<input name="adminName" autocomplete="name" placeholder="Sam"></label>
        <label class="field">Username<input name="adminUser" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="sam"></label></div>
        <label class="field">Password<input name="adminPassword" type="password" autocomplete="new-password" minlength="8"><small>At least 8 characters.</small></label>
      </div>`);
}
function wireSignIn(form) {
  const panel = form.querySelector("#p-accounts");
  if (!panel) return;
  form.querySelectorAll('input[name="webAuth"]').forEach((el) => el.addEventListener("change", () => {
    panel.hidden = form.querySelector('input[name="webAuth"]:checked').value !== "accounts";
  }));
}
const adminFields = (form) => ({name: form.elements.adminName.value.trim(), username: form.elements.adminUser.value.trim(),
  password: form.elements.adminPassword.value});

/** A new install's first visit: how will people sign in? Shown until chosen. */
let SETUP_SHOWN = false;
function openSetup() {
  SETUP_SHOWN = true;
  const form = $("dlg-form");
  $("dlg").classList.add("wide");
  form.innerHTML = `<h3 id="dlg-title">Welcome to TailWatcher</h3>
    <p class="muted" style="margin:0">First, how will people use this page? You can change it later in ⚙ Settings.</p>
    <div class="set-section">${signInChoices(docker() ? "password" : "off", false)}</div>
    <div class="form-error" id="dlg-err" role="alert"></div>
    <div class="dlg-actions"><button type="button" class="btn" id="dlg-cancel">Decide later</button><button type="submit" class="btn primary">Continue</button></div>`;
  wireSignIn(form);
  form.oninput = () => { $("dlg-err").textContent = ""; };
  $("dlg-cancel").onclick = () => $("dlg").close();
  form.onsubmit = async (e) => {
    e.preventDefault();
    const mode = form.querySelector('input[name="webAuth"]:checked').value;
    const r = await api("api/setup", {webAuth: mode, ...(mode === "accounts" ? {admin: adminFields(form)} : {})});
    if (!r.ok) { $("dlg-err").textContent = r.message; return; }
    $("dlg").close(); toast(r.message); load();
  };
  $("dlg").addEventListener("close", () => $("dlg").classList.remove("wide"), {once: true});
  $("dlg").showModal();
}

async function signOut(everywhere) {
  await api("api/logout", {everywhere: !!everywhere});
  location.href = location.pathname.replace(/[^/]*$/, "") + "login";
}

function openMe() {

  $("pp-add").onclick = () => personForm(null);
  form.querySelectorAll("[data-person]").forEach((b) => b.onclick = () => personForm(list.find((a) => a.id === b.dataset.person)));
  form.querySelectorAll("[data-reset]").forEach((b) => b.onclick = async () => {
    const a = list.find((x) => x.id === b.dataset.reset);
    const pw = prompt(`New temporary password for ${a.name} (at least 8 characters). They can change it under My account.`);
    if (!pw) return;
    const r = await api("api/accounts", {op: "password", id: a.id, password: pw});
    if (r.ok) toast(r.message); else $("dlg-err").textContent = r.message;
  });
  form.querySelectorAll("[data-move]").forEach((s) => s.onchange = async () => {
    const r = await api("api/accounts", {op: "move", watcher: s.dataset.move, id: s.value, newTopic: $("pp-newtopic").checked});
    if (!r.ok) { $("dlg-err").textContent = r.message; return; }
    toast(r.message); $("dlg").close(); await load(); openPeople();
  });
  $("dlg").addEventListener("close", () => $("dlg").classList.remove("wide"), {once: true});
  $("dlg").showModal();
}

function personForm(a) {
  $("dlg").close();
  const me = LAST.me.account || {};
  openForm({title: a ? `Edit ${a.name}` : "Add a person", saveLabel: a ? "Save" : "Add person", after: openPeople,
    fields: [
      ...(a ? [] : [{name: "username", label: "Username", placeholder: "mom", required: true, caps: false, hint: "Lowercase letters and numbers; what they type to sign in."}]),
      {name: "name", label: "Name", value: a ? a.name : "", placeholder: "Mom", required: true, caps: false},
      ...(a ? [] : [{name: "password", label: "Temporary password", type: "password", required: true, caps: false, hint: "At least 8 characters. Give it to them; they can change it under My account."}]),
      {name: "role", label: "Role", type: "select", value: a ? a.role : "member",
       options: [["member", "Member: their own watchers and trips"], ["admin", "Admin: also ⚙ Settings and People"]]},
      ...(a ? [] : [{name: "watcher", label: "Make them a watcher too (their own alerts and trips)", type: "check", value: true}]),
    ],
    save: (v) => api("api/accounts", a ? {op: "edit", id: a.id, name: v.name, role: v.role} : {op: "add", ...v}),
    remove: a && a.id !== me.id ? {label: "Delete account", confirm: `Delete ${a.name}'s account, their watchers and their trips? To keep a watcher, move it to someone else first.`,
      run: () => api("api/accounts", {op: "delete", id: a.id})} : null});
}

function openSettings() {
  const s = LAST.settings, form = $("dlg-form");
  $("dlg").classList.add("wide");
  form.innerHTML = `<h3 id="dlg-title">Settings</h3>
    <div class="set-section"><h4>Notifications <button type="button" class="linkbtn help-link" data-act="help" data-section="settings-and-where-alerts-go">? Help</button></h4>
      ${radio("ntfyServer", "public", s.ntfy_server, "ntfy.sh <small>(easiest)</small>", "The free public ntfy service. Nothing to install; each person's topic is a long random name, which keeps their alerts private.")}
      ${radio("ntfyServer", "local", s.ntfy_server, "This server's NTFY <small>(private)</small>", docker() ? "Alerts stay on your hardware: the NTFY at NTFY_URL. TailWatcher sets it up for you below." : "Alerts stay on your hardware. Needs the NTFY package; TailWatcher sets it up for you below.")}
      ${radio("ntfyServer", "custom", s.ntfy_server, "Another ntfy server", "Any ntfy server you run elsewhere.")}
      <div class="sub-panel" id="p-local" ${s.ntfy_server === "local" ? "" : "hidden"}>
        ${s.local_ntfy ? `<div class="status-line">${s.ntfy_server === "local" && s.ntfy_token_set ? "✓ Set up. Run it again any time to change how phones connect." : "Not set up yet."}</div>` : `<div class="form-error">${docker() ? "TailWatcher doesn't know where your NTFY is. Set NTFY_URL (for example http://ntfy:80) in docker-compose.yml and restart TailWatcher." : "NTFY isn't installed (or isn't running). Install it from the StartOS Marketplace, then come back here."}</div>`}
        ${radio("phones", "open", s.ntfy_phone_mode, "Phones connect without a login <small>(recommended)</small>", "Anyone with a Connect phone link subscribes in one tap. Other topics on your NTFY stay locked.")}
        ${radio("phones", "login", s.ntfy_phone_mode, "One NTFY login per person", "More private. TailWatcher makes each person an NTFY account; you enter it once in their ntfy app.")}
        <label class="field" for="s-admin">NTFY admin password
          <input id="s-admin" type="password" autocomplete="off" placeholder="From NTFY's Set Admin Password step">
          <small>Used once for setup and never saved. Lost it? NTFY → Actions → Reset User Password → admin.</small></label>
        <div><button type="button" class="btn primary" id="s-setup">Set up NTFY for me</button></div>
        <div id="s-setup-result"></div>
      </div>
      <div class="sub-panel" id="p-custom" ${s.ntfy_server === "custom" ? "" : "hidden"}>
        <label class="field">Server address<input name="ntfyCustomUrl" value="${esc(s.ntfy_custom_url)}" placeholder="https://ntfy.example.com" autocomplete="off" spellcheck="false"></label>
        <label class="field">Access token <input name="ntfyToken" type="password" placeholder="${s.ntfy_token_set ? "Saved. Type a new one to replace it" : "tk_… (only if the server needs it)"}" autocomplete="off"></label>
      </div>
    </div>
    <div class="set-section"><h4>Trips</h4>
      <label class="field">AeroDataBox API key (optional)
        <input name="aerodataboxKey" type="password" placeholder="${s.aerodatabox ? "Saved. Type a new one to replace it" : "RapidAPI key"}" autocomplete="off">
        <small>Lets "inbound UA1234" find the plane flying in for your flight. Free Basic plan at rapidapi.com/aedbx-aedbx/api/aerodatabox.</small></label>
      ${s.aerodatabox ? `<label class="field check"><input type="checkbox" name="clearAerodatabox"> Remove the saved key</label>` : ""}
    </div>
    <div class="set-section"><h4>Checking</h4>
      <div class="two">
        <label class="field">ADS-B feed ${sel("dataSource", s.data_source, [["adsb.fi", "adsb.fi"], ["adsb.lol", "adsb.lol"]])}</label>
        <label class="field">Check every (seconds)<input name="pollSeconds" type="number" min="15" max="600" value="${s.poll_seconds}" inputmode="numeric"></label>
      </div>
    </div>
    <div class="set-section"><h4>Display and access</h4>
      <div class="two">
        <label class="field">Default time zone ${sel("timeZone", s.time_zone, s.time_zones)}</label>
        <label class="field">Map buttons ${sel("mapLinks", s.map_links, [["adsbx", "ADS-B Exchange"], ["adsblol", "adsb.lol"], ["both", "Both"]])}</label>
      </div>
      <label class="field check"><input type="checkbox" name="textCommands" ${s.text_commands ? "checked" : ""}> Text commands (people manage their list by typing in their topic)</label>
    </div>
    <div class="set-section"><h4>Signing in to this page <button type="button" class="linkbtn help-link" data-act="help" data-section="family-accounts">? Help</button></h4>
      ${signInChoices(s.web_auth, s.has_accounts)}
    </div>
    <div class="form-error" id="dlg-err" role="alert"></div>
    <div class="dlg-actions"><button type="button" class="btn" id="dlg-cancel">Close</button><button type="submit" class="btn primary">Save settings</button></div>`;

  const show = () => {
    const v = form.querySelector('input[name="ntfyServer"]:checked').value;
    $("p-local").hidden = v !== "local";
    $("p-custom").hidden = v !== "custom";
  };
  form.querySelectorAll('input[name="ntfyServer"]').forEach((el) => el.addEventListener("change", show));
  $("dlg-cancel").onclick = () => $("dlg").close();
  form.oninput = () => { $("dlg-err").textContent = ""; };

  $("s-setup").onclick = async () => {
    const btn = $("s-setup"), out = $("s-setup-result");
    btn.disabled = true; btn.textContent = "Setting up…";
    const r = await api("api/ntfy-setup", {adminPassword: $("s-admin").value, phones: form.querySelector('input[name="phones"]:checked').value});
    btn.disabled = false; btn.textContent = "Set up NTFY for me";
    $("s-admin").value = "";
    out.innerHTML = r.ok ? `<ul class="steps-done">${(r.steps || []).map((x) => `<li>${esc(x)}</li>`).join("")}</ul>${credsHtml(r.logins || [])}`
      : `<div class="form-error">${esc(r.message)}</div>`;
    if (r.ok) { toast("NTFY is set up."); load(); }
  };

  form.onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(form), body = {};
    body.ntfyServer = f.get("ntfyServer");
    if (body.ntfyServer === "custom") { body.ntfyCustomUrl = (f.get("ntfyCustomUrl") || "").trim(); if (f.get("ntfyToken")) body.ntfyToken = f.get("ntfyToken").trim(); }
    if (body.ntfyServer === "local" && !(s.ntfy_server === "local" && s.ntfy_token_set) && !confirm("You haven't run \"Set up NTFY for me\" yet. Switch to this server's NTFY anyway?")) return;
    if (f.get("aerodataboxKey")) body.aerodataboxKey = f.get("aerodataboxKey").trim();
    if (f.get("clearAerodatabox")) body.clearAerodatabox = true;
    Object.assign(body, {dataSource: f.get("dataSource"), pollSeconds: f.get("pollSeconds"), timeZone: f.get("timeZone"),
      mapLinks: f.get("mapLinks"), textCommands: !!f.get("textCommands"), webAuth: f.get("webAuth")});
    if (body.webAuth === "accounts" && !s.has_accounts) body.admin = adminFields(form);
    if (s.web_auth === "accounts" && body.webAuth !== "accounts"
        && !confirm("Turn off family accounts? Everyone will see every watcher and trip again. (Their accounts are kept for if you turn it back on.)")) return;
    const r = await api("api/settings", body);
    if (!r.ok) { $("dlg-err").textContent = r.message; return; }
    $("dlg").close(); toast(r.message);
    if (body.webAuth !== s.web_auth) setTimeout(() => location.reload(), 1200);  // signs this browser in or out
    else load();
  };
  wireSignIn(form);
  $("dlg").addEventListener("close", () => $("dlg").classList.remove("wide"), {once: true});
  $("dlg").showModal();
}

function onAction(btn) {
  if (btn.dataset.act === "help") return openHelp(btn.dataset.section);  // works even before the state loads
  if (!LAST) return;
  const {act, topic, number, ident} = btn.dataset;
  const w = LAST.watchers.find((x) => x.topic === topic);
  const t = LAST.trips.find((x) => x.topic === topic && String(x.number) === number);
  if (act === "add-trip") {
    if (!LAST.watchers.length) return toast("Add a watcher first.");
    return tripForm(null);
  }
  if (act === "import-trip") {
    if (!LAST.watchers.length) return toast("Add a watcher first.");
    return importForm();
  }
  if (act === "edit-trip" && t) return tripForm(t);
  if (act === "cancel-trip" && t) {
    const p = othersOf(t);
    if (confirm(p.length ? `Stop tracking ${[t, ...p].map((x) => x.flight).join(", ")}? (To keep some, use Edit.)` : `Stop tracking ${t.flight}?`)) api("api/trip", {op: "cancel", topic, number: t.number}).then((r) => { toast(r.message); load(); });
    return;
  }
  if (act === "add-watcher") return watcherForm(null);
  if (act === "connect" && w) return connectPhone(w);
  if (act === "settings") return openSettings();
  if (act === "me") return openMe();
  if (act === "people") return openPeople();
  if (act === "unfollow") {
    const f = (LAST.shared || []).find((x) => x.id === btn.dataset.id);
    if (f && confirm(`Stop getting alerts for ${f.owner}'s ${f.flight}? ${f.owner} gets a note, and can share it with you again.`))
      api("api/unfollow", {id: f.id}).then((r) => { toast(r.message); load(); });
    return;
  }
  if (act === "edit-watcher" && w) return watcherForm(w);
  if (act === "add-aircraft" && w) return aircraftForm(w, null);
  if (act === "edit-aircraft" && w) return aircraftForm(w, w.aircraft.find((a) => a.ident === ident));
}

function applyTheme(theme, rerender) {
  THEME = theme === "board" ? "board" : "modern";
  document.body.classList.toggle("theme-board", THEME === "board");
  document.querySelector('meta[name="theme-color"]').content = THEME === "board" ? "#08090b" : "#0e2546";
  document.querySelectorAll(".themes button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.theme === THEME)));
  try { localStorage.setItem("tw-theme", THEME); } catch (e) { /* storage blocked: still switches for this visit */ }
  if (rerender && LAST) { for (const k in PREV) delete PREV[k]; render(LAST); }
}

function render(d) {
  LAST = d;
  TZ = d.time_zone; NOW = d.now; lastLoad = Date.now();
  $("dot").className = "dot " + (d.health.ok ? "" : "bad");
  $("statusText").textContent = d.health.message || (d.health.ok ? "Watching" : "Needs attention");
  renderStats(d);
  if (THEME === "board") { renderTripsBoard(d); renderWatchersBoard(d); } else { renderTrips(d); renderWatchers(d); }
  renderShared(d); renderFeed(d); renderSystem(d);
  const me = d.me, signedIn = me.mode !== "off";
  $("btn-settings").hidden = !me.admin;
  $("btn-people").hidden = !(me.admin && me.mode === "accounts");
  $("btn-me").hidden = !signedIn;
  $("me-label").textContent = " " + (me.account ? me.account.name : "Sign out");
  $("foot").innerHTML = `TailWatcher ${esc(d.version)}${me.account ? ` · signed in as ${esc(me.account.username)}` : ""} · times in ${esc(d.time_zone.replace("_", " "))} · updates every 20 s · <button type="button" class="linkbtn" data-act="help">Help</button>`;
  if (me.setup && me.admin && !SETUP_SHOWN && !$("dlg").open && !$("help").open) openSetup();
}

async function load() {
  try {
    // Built from origin + path: a page opened as https://user:pass@host/ would
    // otherwise hand its credentials to fetch(), which refuses them.
    const url = location.origin + location.pathname.replace(/[^/]*$/, "") + "api/state";
    const r = await fetch(url, {cache: "no-store", credentials: "same-origin"});
    if (r.status === 401) { location.href = location.pathname.replace(/[^/]*$/, "") + "login"; return; }  // signed out
    if (!r.ok) throw new Error("HTTP " + r.status);
    render(await r.json());
  } catch (err) {
    $("dot").className = "dot bad";
    $("statusText").textContent = "Can't reach TailWatcher (" + err.message + ")";
  }
}

document.addEventListener("click", (e) => {
  if (e.target.classList.contains("ev-msg")) e.target.classList.toggle("open");
  const b = e.target.closest(".themes button");
  if (b) applyTheme(b.dataset.theme, true);
  const act = e.target.closest("[data-act]");
  if (act) onAction(act);
});
applyTheme(THEME, false);
$("help").addEventListener("close", () => {
  if (helpHash() !== null) { if (HELP_PUSHED) history.back(); else history.replaceState(null, "", location.pathname + location.search); }
  HELP_PUSHED = false;
});
window.addEventListener("popstate", () => {
  const t = helpHash();
  if (t === null) { if ($("help").open) { HELP_PUSHED = false; $("help").close(); } }
  else openHelp(t);
});
if (helpHash() !== null) openHelp(helpHash());
document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - lastLoad > 15000) load(); });
setInterval(() => { if (!document.hidden) load(); }, 20000);
load();
</script>
</body>
